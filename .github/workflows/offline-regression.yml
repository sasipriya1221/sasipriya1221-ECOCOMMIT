name: Offline Regression

on:
  push:
    branches: [main, candidate7-structural-semantic-fix]
  pull_request:

concurrency:
  group: offline-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run deterministic regression suite
        run: python -m pytest tests -p no:cacheprovider --basetemp .test-tmp-ci
      - name: Run mocked qualification harness tests
        run: python -m pytest diagnostic_tests/candidate7_qualification_harness_mock_tests.py -p no:cacheprovider --basetemp .test-tmp-c7-harness-ci
      - name: Run zero-provider qualification harness self-check
        run: python scripts/candidate7_pass2_qualification.py self-check
      - name: Static runtime checks
        run: |
          python -m compileall -q src scripts tests diagnostic_tests
          node --check ui/app.js
          git diff --check
      - name: Validate public-repository structure
        run: python scripts/checkpoint_e_readiness.py
