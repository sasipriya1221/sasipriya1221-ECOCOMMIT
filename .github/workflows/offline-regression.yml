name: Offline Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'CHECKPOINT_*_VALIDATION.md'
      - 'PROGRESS.md'
      - 'README.md'
      - 'pyproject.toml'
      - 'requirements-dev.lock'
      - '.github/workflows/offline-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - 'CHECKPOINT_*_VALIDATION.md'
      - 'PROGRESS.md'
      - 'README.md'
      - 'pyproject.toml'
      - 'requirements-dev.lock'

concurrency:
  group: offline-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run regression suite
        run: python -m pytest -p no:cacheprovider --basetemp .test-tmp-ci
      - name: Validate public-repository structure
        run: python scripts/checkpoint_e_readiness.py
