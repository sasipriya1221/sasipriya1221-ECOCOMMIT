name: Candidate 6 - Development Qualification (Dispatcher)

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate-6 branch or commit to qualify
        required: true
        default: candidate6-internal-qualification
        type: string

concurrency:
  group: candidate6-development-dispatch
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false
      - name: Bind exact Candidate-6 source
        shell: python
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          import hashlib, json, os, subprocess
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          payload = {
              "candidate": "A-CANDIDATE-6",
              "candidate_ref": os.environ["CANDIDATE_REF"],
              "candidate_sha": sha,
              "dispatcher_run_id": os.environ["GITHUB_RUN_ID"],
              "dispatcher_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          raw = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          payload["binding_sha256"] = hashlib.sha256(raw).hexdigest()
          with open("/tmp/candidate6-source-binding.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Deterministic pre-provider gate
        run: |
          python -m pytest -p no:cacheprovider --basetemp .test-tmp-c6-dev
          python -m compileall -q src scripts tests
          git diff --check
      - name: Run 60-case Candidate-6 development qualification
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: python scripts/candidate6_qualify.py --mode development --output-dir artifacts/candidate6-development
      - name: Attach exact source binding to evidence
        if: always()
        run: |
          mkdir -p artifacts/candidate6-development
          cp /tmp/candidate6-source-binding.json artifacts/candidate6-development/source-binding.json
      - name: Preserve complete development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate6-development-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate6-development/
          if-no-files-found: warn
          retention-days: 30
