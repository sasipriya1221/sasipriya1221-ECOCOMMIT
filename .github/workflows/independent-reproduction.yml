name: Independent Clean-Machine Reproduction

on:
  workflow_run:
    workflows: ["Offline Regression"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: independent-reproduction-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  reproduce:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Record clean reproduction start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/reproduction
          date -u +'%Y-%m-%dT%H:%M:%SZ' > artifacts/reproduction/started_at.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Install hash-locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check | tee artifacts/reproduction/dependency-check.txt
      - name: Run independent full regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -p no:cacheprovider --basetemp .test-tmp-independent \
            --junitxml=artifacts/reproduction/pytest.xml
      - name: Run independent static and repository checks
        shell: bash
        run: |
          set -euo pipefail
          {
            python -m compileall -q src scripts tests
            node --check ui/app.js
            git diff --check
          } > artifacts/reproduction/static-checks.txt 2>&1
          python scripts/checkpoint_e_readiness.py > artifacts/reproduction/readiness.json
      - name: Verify source is still exact public main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.workflow_run.head_sha }}"
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$REMOTE_SHA"
          test "$REMOTE_SHA" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Build self-digesting independent reproduction receipt
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT_NAME: checkpoint-e-independent-reproduction-${{ github.run_id }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          import platform
          import subprocess
          import tarfile
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          from scripts.checkpoint_e_readiness import IndependentReproductionReceipt

          root = Path.cwd()
          out = root / "artifacts" / "reproduction"

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          source_revision = os.environ["SOURCE_SHA"]
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != source_revision:
              raise SystemExit("source revision changed during reproduction")
          source_tree_id = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()

          junit = ET.parse(out / "pytest.xml").getroot()
          collected = int(junit.attrib.get("tests", 0))
          failures = int(junit.attrib.get("failures", 0))
          errors = int(junit.attrib.get("errors", 0))
          skipped = int(junit.attrib.get("skipped", 0))
          passed = collected - failures - errors - skipped
          if collected <= 0 or failures or errors or skipped or passed != collected:
              raise SystemExit("independent regression was not a complete pass")

          readiness = json.loads((out / "readiness.json").read_text(encoding="utf-8"))
          checks = readiness.get("checks", [])
          if not checks or not all(item.get("passed") is True for item in checks):
              raise SystemExit("independent repository readiness checks did not all pass")
          if readiness.get("source_revision") != source_revision:
              raise SystemExit("readiness report source mismatch")
          if readiness.get("working_tree_clean") is not True:
              raise SystemExit("readiness report did not observe a clean tree")
          if readiness.get("upstream", {}).get("ahead") != 0 or readiness.get("upstream", {}).get("behind") != 0:
              raise SystemExit("readiness report did not observe exact upstream state")

          commands = {
              "schema_version": "E.REPRODUCTION.COMMANDS.1",
              "source_revision": source_revision,
              "commands": [
                  "python -m pip install --require-hashes -r requirements-dev.lock",
                  "python -m pip install --no-deps --no-build-isolation -e .",
                  "python -m pip check",
                  "python -m pytest -p no:cacheprovider --basetemp .test-tmp-independent --junitxml=artifacts/reproduction/pytest.xml",
                  "python -m compileall -q src scripts tests",
                  "node --check ui/app.js",
                  "git diff --check",
                  "python scripts/checkpoint_e_readiness.py",
              ],
              "provider_calls": False,
              "fixture_outputs_promoted": False,
          }
          commands_path = out / "commands.json"
          commands_path.write_text(
              json.dumps(commands, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          bundle_inputs = [
              "commands.json",
              "dependency-check.txt",
              "pytest.xml",
              "readiness.json",
              "static-checks.txt",
              "started_at.txt",
          ]
          bundle_path = out / "reproduction-bundle.tar"
          with tarfile.open(bundle_path, "w", format=tarfile.USTAR_FORMAT) as archive:
              for name in sorted(bundle_inputs):
                  path = out / name
                  info = archive.gettarinfo(str(path), arcname=name)
                  info.uid = info.gid = 0
                  info.uname = info.gname = ""
                  info.mtime = 0
                  with path.open("rb") as handle:
                      archive.addfile(info, handle)

          machine_material = json.dumps(
              {
                  "runner_os": os.environ.get("RUNNER_OS", "unknown"),
                  "runner_arch": os.environ.get("RUNNER_ARCH", "unknown"),
                  "runner_name": os.environ.get("RUNNER_NAME", "unknown"),
                  "platform_node": platform.node(),
              },
              sort_keys=True,
              separators=(",", ":"),
          ).encode()
          platform_material = json.dumps(
              {
                  "platform": platform.platform(),
                  "machine": platform.machine(),
                  "python": platform.python_version(),
              },
              sort_keys=True,
              separators=(",", ":"),
          ).encode()

          started = datetime.fromisoformat(
              (out / "started_at.txt").read_text(encoding="utf-8").strip().replace("Z", "+00:00")
          )
          completed = datetime.now(timezone.utc)
          evidence_reference = (
              f"github-actions://{os.environ['GITHUB_REPOSITORY']}/runs/"
              f"{os.environ['GITHUB_RUN_ID']}/artifacts/{os.environ['ARTIFACT_NAME']}"
          )

          receipt = IndependentReproductionReceipt.create(
              source_revision=source_revision,
              source_tree_id=source_tree_id,
              dependency_lock_sha256=sha(root / "requirements-dev.lock"),
              machine_identity_sha256=hashlib.sha256(machine_material).hexdigest(),
              verifier_identity_sha256=sha(root / "scripts" / "checkpoint_e_readiness.py"),
              platform_sha256=hashlib.sha256(platform_material).hexdigest(),
              python_version=platform.python_version(),
              started_at_utc=started,
              completed_at_utc=completed,
              collected_tests=collected,
              passed_tests=passed,
              failed_tests=failures,
              error_tests=errors,
              readiness_checks_collected=len(checks),
              readiness_checks_passed=sum(item.get("passed") is True for item in checks),
              test_report_sha256=sha(out / "pytest.xml"),
              dependency_check_report_sha256=sha(out / "dependency-check.txt"),
              readiness_report_sha256=sha(out / "readiness.json"),
              commands_manifest_sha256=sha(commands_path),
              artifact_bundle_sha256=sha(bundle_path),
              evidence_reference=evidence_reference,
          )
          receipt_path = out / "independent-reproduction-receipt.json"
          receipt_path.write_text(
              json.dumps(receipt.model_dump(mode="json"), sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          IndependentReproductionReceipt.model_validate_json(receipt_path.read_text(encoding="utf-8"))
          print(f"INDEPENDENT_REPRODUCTION_OK tests={passed}/{collected} readiness={len(checks)}/{len(checks)}")
          print(f"RECEIPT_SHA256={receipt.receipt_sha256}")
      - name: Upload immutable reproduction evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkpoint-e-independent-reproduction-${{ github.run_id }}
          path: artifacts/reproduction/
          if-no-files-found: error
          retention-days: 30
      - name: Publish compact reproduction summary
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              Path("artifacts/reproduction/independent-reproduction-receipt.json").read_text(encoding="utf-8")
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# ECOCOMMIT independent clean-machine reproduction\n\n")
              summary.write(f"- Source revision: `{receipt['source_revision']}`\n")
              summary.write(f"- Tests: `{receipt['passed_tests']}/{receipt['collected_tests']}`\n")
              summary.write(
                  f"- Repository checks: `{receipt['readiness_checks_passed']}/{receipt['readiness_checks_collected']}`\n"
              )
              summary.write(f"- Receipt SHA-256: `{receipt['receipt_sha256']}`\n")
              summary.write("- Provider calls: `false`\n")
              summary.write("- Fixture outputs promoted: `false`\n")
