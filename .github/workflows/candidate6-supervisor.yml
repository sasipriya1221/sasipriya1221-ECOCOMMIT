name: Candidate 6 - Fail-Closed Supervisor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: candidate6-fail-closed-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          path: supervisor
          persist-credentials: false
      - name: Inspect machine-verifiable stage state
        id: inspect
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          base = 'https://api.github.com/repos/' + repo
          token = os.environ['GH_TOKEN']
          def get(path):
              req = Request(base + path, headers={'Accept': 'application/vnd.github+json'})
              req.add_unredirected_header('Authorization', 'Bearer ' + token)
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != req.full_url:
                      raise SystemExit('GitHub evidence redirect rejected')
                  return json.load(response)
          def maybe_get(path):
              try:
                  return get(path)
              except HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          branch = get('/branches/candidate6-internal-qualification')
          candidate_head = branch['commit']['sha']
          freeze_file = maybe_get('/contents/evidence/candidate6-freeze-receipt.json?ref=candidate6-internal-qualification')
          phase = 'DEVELOPMENT'
          outputs = {'candidate_head': candidate_head}

          if freeze_file is not None:
              raw = base64.b64decode(freeze_file['content'])
              receipt = json.loads(raw.decode('utf-8'))
              expected = receipt.get('freeze_receipt_sha256')
              unsigned = {k: v for k, v in receipt.items() if k != 'freeze_receipt_sha256'}
              actual = hashlib.sha256(json.dumps(unsigned, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              if not isinstance(expected, str) or expected != actual:
                  phase = 'STOP_INVALID_FREEZE_RECEIPT'
              elif receipt.get('candidate') != 'A-CANDIDATE-6' or receipt.get('freeze_state') != 'IMPLEMENTATION_FROZEN_BEFORE_HOLDOUT':
                  phase = 'STOP_INVALID_FREEZE_RECEIPT'
              else:
                  phase = 'FROZEN'
                  outputs['frozen_source_sha'] = str(receipt.get('candidate_source_revision', ''))
          else:
              runs = get('/actions/workflows/candidate6-development-dispatch.yml/runs?event=workflow_dispatch&per_page=20')
              if not runs.get('workflow_runs'):
                  phase = 'WAIT_NO_DEVELOPMENT_RUN'
              else:
                  run = runs['workflow_runs'][0]
                  outputs['development_run_id'] = str(run['id'])
                  outputs['development_run_attempt'] = str(run['run_attempt'])
                  outputs['development_status'] = str(run['status'])
                  outputs['development_conclusion'] = str(run.get('conclusion') or '')
                  phase = 'DEVELOPMENT_COMPLETE' if run['status'] == 'completed' else 'WAIT_DEVELOPMENT_RUNNING'

          outputs['phase'] = phase
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              for key, value in outputs.items():
                  fh.write(f'{key}={value}\n')
          os.makedirs('artifacts/supervisor', exist_ok=True)
          with open('artifacts/supervisor/inspect.json', 'w', encoding='utf-8') as fh:
              json.dump({'phase': phase, **outputs}, fh, indent=2, sort_keys=True)

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.inspect.outputs.phase == 'DEVELOPMENT_COMPLETE'
        with:
          name: candidate6-development-${{ steps.inspect.outputs.development_run_id }}-attempt-${{ steps.inspect.outputs.development_run_attempt }}
          run-id: ${{ steps.inspect.outputs.development_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/development

      - name: Decide development transition from signed evidence only
        id: development_decision
        if: steps.inspect.outputs.phase == 'DEVELOPMENT_COMPLETE'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_HEAD: ${{ steps.inspect.outputs.candidate_head }}
          DEVELOPMENT_RUN_ID: ${{ steps.inspect.outputs.development_run_id }}
          DEVELOPMENT_RUN_ATTEMPT: ${{ steps.inspect.outputs.development_run_attempt }}
        run: |
          import hashlib, json, os, sys
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen
          sys.path.insert(0, str(Path('supervisor').resolve()))
          from scripts.candidate6_supervisor_decision import canonical_sha256, decide, extract_checked_out_sha

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com/repos/' + repo
          def get_json(path):
              req = Request(api + path, headers={'Accept': 'application/vnd.github+json'})
              req.add_unredirected_header('Authorization', 'Bearer ' + token)
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != req.full_url:
                      raise SystemExit('GitHub evidence redirect rejected')
                  return json.load(response)
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def job_log_bytes(job_id):
              req = Request(api + '/actions/jobs/' + str(job_id) + '/logs', headers={'Accept': 'application/vnd.github+json'})
              req.add_unredirected_header('Authorization', 'Bearer ' + token)
              try:
                  build_opener(NoRedirect).open(req, timeout=30)
              except HTTPError as exc:
                  if exc.code not in (301, 302, 303, 307, 308):
                      raise
                  location = exc.headers.get('Location')
                  if not location or not location.startswith('https://'):
                      raise SystemExit('invalid GitHub job-log redirect')
              else:
                  raise SystemExit('expected GitHub job-log redirect')
              with urlopen(Request(location), timeout=30) as response:
                  return response.read(16 * 1024 * 1024 + 1)

          root = Path('artifacts/development')
          aggregate_path = root / 'aggregate.json'
          binding_path = root / 'source-binding.json'
          if not aggregate_path.exists():
              raise SystemExit('development aggregate evidence missing')
          aggregate = json.loads(aggregate_path.read_text(encoding='utf-8'))

          provenance = None
          if binding_path.exists():
              binding = json.loads(binding_path.read_text(encoding='utf-8'))
              unsigned_binding = {k: v for k, v in binding.items() if k != 'binding_sha256'}
              if binding.get('binding_sha256') != canonical_sha256(unsigned_binding):
                  raise SystemExit('development source binding digest invalid')
              if binding.get('candidate') != 'A-CANDIDATE-6':
                  raise SystemExit('development candidate binding invalid')
              if binding.get('candidate_sha') != os.environ['CANDIDATE_HEAD']:
                  raise SystemExit('Candidate-6 branch differs from development source; no automatic freeze')
              if str(binding.get('dispatcher_run_id')) != os.environ['DEVELOPMENT_RUN_ID'] or str(binding.get('dispatcher_run_attempt')) != os.environ['DEVELOPMENT_RUN_ATTEMPT']:
                  raise SystemExit('development workflow provenance mismatch')
              provenance = {
                  'method': 'source-binding-artifact',
                  'sha256': hashlib.sha256(binding_path.read_bytes()).hexdigest(),
              }
          else:
              jobs = get_json('/actions/runs/' + os.environ['DEVELOPMENT_RUN_ID'] + '/attempts/' + os.environ['DEVELOPMENT_RUN_ATTEMPT'] + '/jobs?per_page=100')
              qualify = [j for j in jobs.get('jobs', []) if j.get('name') == 'qualify']
              if len(qualify) != 1 or qualify[0].get('status') != 'completed':
                  raise SystemExit('unique completed development job not proven')
              raw = job_log_bytes(qualify[0]['id'])
              if len(raw) > 16 * 1024 * 1024:
                  raise SystemExit('development job log exceeds evidence bound')
              text = raw.decode('utf-8-sig')
              checkout_sha = extract_checked_out_sha(text)
              if checkout_sha != os.environ['CANDIDATE_HEAD']:
                  raise SystemExit('Candidate-6 branch differs from checkout proven by development log')
              provenance = {
                  'method': 'immutable-job-log',
                  'job_id': qualify[0]['id'],
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'candidate_sha': checkout_sha,
              }
              Path('artifacts/supervisor/development-log-provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          receipt = {
              'stage': 'development',
              'qualification_state': aggregate.get('qualification_state'),
              'passed': aggregate.get('passed'),
              'terminal_semantic_cases': aggregate.get('terminal_semantic_cases'),
              'provider_deferred_cases': aggregate.get('provider_deferred_cases'),
              'counts': aggregate.get('counts'),
              'metrics': aggregate.get('metrics'),
              'development_run_id': int(os.environ['DEVELOPMENT_RUN_ID']),
              'development_run_attempt': int(os.environ['DEVELOPMENT_RUN_ATTEMPT']),
              'candidate_sha': os.environ['CANDIDATE_HEAD'],
              'aggregate_sha256': hashlib.sha256(aggregate_path.read_bytes()).hexdigest(),
              'source_provenance': provenance,
          }
          receipt['receipt_sha256'] = canonical_sha256(receipt)
          decision = decide('development', receipt)
          Path('artifacts/supervisor/development-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          Path('artifacts/supervisor/development-decision.json').write_text(json.dumps({'action': decision.action, 'reason': decision.reason}, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('action=' + decision.action + '\n')
              fh.write('reason=' + decision.reason + '\n')

      - name: Dispatch freeze gate once after proven development PASS
        if: steps.development_decision.outputs.action == 'FREEZE'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.inspect.outputs.candidate_head }}
          DEVELOPMENT_RUN_ID: ${{ steps.inspect.outputs.development_run_id }}
          DEVELOPMENT_RUN_ATTEMPT: ${{ steps.inspect.outputs.development_run_attempt }}
        run: |
          import json, os
          from urllib.request import Request, urlopen
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base = 'https://api.github.com/repos/' + repo
          def get(path):
              req = Request(base + path, headers={'Accept': 'application/vnd.github+json'})
              req.add_unredirected_header('Authorization', 'Bearer ' + token)
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != req.full_url:
                      raise SystemExit('GitHub evidence redirect rejected')
                  return json.load(response)
          prior = get('/actions/workflows/candidate6-freeze.yml/runs?per_page=1')
          if prior.get('total_count', 0) != 0:
              raise SystemExit('freeze workflow already has history; automatic duplicate dispatch refused')
          payload = json.dumps({
              'ref': 'main',
              'inputs': {
                  'development_run_id': os.environ['DEVELOPMENT_RUN_ID'],
                  'development_run_attempt': os.environ['DEVELOPMENT_RUN_ATTEMPT'],
                  'candidate_sha': os.environ['CANDIDATE_SHA'],
              },
          }, separators=(',', ':')).encode()
          req = Request(base + '/actions/workflows/candidate6-freeze.yml/dispatches', data=payload, headers={'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          req.add_unredirected_header('Authorization', 'Bearer ' + token)
          with urlopen(req, timeout=30) as response:
              if response.geturl() != req.full_url or response.status != 204:
                  raise SystemExit('freeze dispatch failed')
          with open('artifacts/supervisor/transition.json', 'w', encoding='utf-8') as fh:
              json.dump({'transition': 'DEVELOPMENT_PASS_TO_FREEZE', 'candidate_sha': os.environ['CANDIDATE_SHA'], 'development_run_id': int(os.environ['DEVELOPMENT_RUN_ID']), 'development_run_attempt': int(os.environ['DEVELOPMENT_RUN_ATTEMPT'])}, fh, indent=2, sort_keys=True)

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        if: steps.inspect.outputs.phase == 'FROZEN'
        with:
          ref: candidate6-internal-qualification
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.inspect.outputs.phase == 'FROZEN'
        with:
          python-version: '3.11'
          cache-dependency-path: candidate/requirements-dev.lock
      - name: Verify frozen Candidate-6 receipt exactly
        if: steps.inspect.outputs.phase == 'FROZEN'
        working-directory: candidate
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
          python - <<'PY'
          import json, re
          from pathlib import Path
          from ecocommit.candidate6_freeze import verify_freeze_receipt
          receipt = json.loads(Path('evidence/candidate6-freeze-receipt.json').read_text(encoding='utf-8'))
          if not re.fullmatch(r'[0-9a-f]{40}', str(receipt.get('candidate_source_revision', ''))):
              raise SystemExit('freeze receipt exact source revision missing')
          verify_freeze_receipt(Path.cwd(), receipt)
          PY

      - name: Dispatch sealed holdout only if never dispatched before
        if: steps.inspect.outputs.phase == 'FROZEN'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ steps.inspect.outputs.candidate_head }}
        run: |
          import json, os
          from urllib.request import Request, urlopen
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base = 'https://api.github.com/repos/' + repo
          def get(path):
              req = Request(base + path, headers={'Accept': 'application/vnd.github+json'})
              req.add_unredirected_header('Authorization', 'Bearer ' + token)
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != req.full_url:
                      raise SystemExit('GitHub evidence redirect rejected')
                  return json.load(response)
          runs = get('/actions/workflows/candidate6-holdout-dispatch.yml/runs?per_page=1')
          if runs.get('total_count', 0) != 0:
              with open('artifacts/supervisor/holdout-state.json', 'w', encoding='utf-8') as fh:
                  json.dump({'state': 'HOLDOUT_ALREADY_HAS_HISTORY', 'run_id': runs['workflow_runs'][0]['id'], 'status': runs['workflow_runs'][0]['status'], 'conclusion': runs['workflow_runs'][0].get('conclusion')}, fh, indent=2, sort_keys=True)
              raise SystemExit(0)
          payload = json.dumps({'ref': 'main', 'inputs': {'candidate_ref': os.environ['CANDIDATE_REF']}}, separators=(',', ':')).encode()
          req = Request(base + '/actions/workflows/candidate6-holdout-dispatch.yml/dispatches', data=payload, headers={'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          req.add_unredirected_header('Authorization', 'Bearer ' + token)
          with urlopen(req, timeout=30) as response:
              if response.geturl() != req.full_url or response.status != 204:
                  raise SystemExit('holdout dispatch failed')
          with open('artifacts/supervisor/transition.json', 'w', encoding='utf-8') as fh:
              json.dump({'transition': 'VERIFIED_FREEZE_TO_ONE_SHOT_HOLDOUT', 'candidate_ref': os.environ['CANDIDATE_REF']}, fh, indent=2, sort_keys=True)

      - name: Preserve supervisor audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate6-supervisor-${{ github.run_id }}
          path: artifacts/supervisor/
          if-no-files-found: warn
          retention-days: 30
