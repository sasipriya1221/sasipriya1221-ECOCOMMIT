name: Candidate 7 - Official A Preregistration
on:
  workflow_dispatch:
    inputs:
      qualification_run_id: {required: true, type: string}
      qualification_run_attempt: {required: true, type: string}
      qualification_artifact_id: {required: true, type: string}
      qualification_archive_sha256: {required: true, type: string}
jobs:
  preregister:
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", path: supervisor, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 12d121f80a6cacd94376c6d2b7bce7dff5212eb5, path: candidate, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Install exact dependencies
        working-directory: supervisor
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify retained qualification artifact metadata
        env: {GH_TOKEN: "${{ github.token }}", RUN_ID: "${{ inputs.qualification_run_id }}", ATTEMPT: "${{ inputs.qualification_run_attempt }}", ARTIFACT_ID: "${{ inputs.qualification_artifact_id }}", ARCHIVE_SHA: "${{ inputs.qualification_archive_sha256 }}"}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID} --jq .run_attempt)" = "$ATTEMPT"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID} --jq .digest)" = "sha256:${ARCHIVE_SHA}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: "${{ inputs.qualification_artifact_id }}", github-token: "${{ github.token }}", path: qualification}
      - name: Build immutable preregistration
        run: >-
          python supervisor/scripts/checkpoint_a_candidate7_prereg.py --candidate-root candidate
          --binding qualification/source-binding.json --summary qualification/summary.json
          --qualification-artifact github-actions://${{ github.repository }}/runs/${{ inputs.qualification_run_id }}/artifacts/${{ inputs.qualification_artifact_id }}
          --qualification-archive-sha256 ${{ inputs.qualification_archive_sha256 }} --output bundle/checkpoint-a-candidate7-preregistration.json
      - name: Bundle qualification pins
        run: cp qualification/source-binding.json qualification/summary.json bundle/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "checkpoint-a-candidate7-preregistration-${{ github.run_id }}", path: bundle/, if-no-files-found: error, retention-days: 30}
