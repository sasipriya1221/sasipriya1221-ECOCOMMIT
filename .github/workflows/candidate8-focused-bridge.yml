name: Candidate 8 - Exact Source Focused Bridge

on:
  push:
    branches: [main]
    paths:
      - evidence/candidate8-focused-request.json

concurrency:
  group: candidate8-focused-bridge
  cancel-in-progress: false

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: candidate8-semantic-role-redesign
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact requested Candidate-8 source
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path
          requested = json.loads(subprocess.check_output([
              "git", "show", "origin/main:evidence/candidate8-focused-request.json"
          ], text=True))
          if requested.get("candidate") != "A-CANDIDATE-8":
              raise SystemExit("invalid candidate marker")
          expected = requested.get("source_sha")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected:
              raise SystemExit(f"Candidate-8 head {actual} != requested source {expected}")
          Path("/tmp/c8-source.txt").write_text(actual, encoding="utf-8")
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run Candidate-8 focused deterministic tests
        run: python -m pytest tests/test_candidate8_semantics.py -p no:cacheprovider --basetemp .test-tmp-c8-focused
      - name: Static checks
        run: |
          python -m compileall -q src/ecocommit/candidate8.py src/ecocommit/candidate8_logic.py src/ecocommit/candidate8_provider.py src/ecocommit/candidate8_relation_checklist.py tests/test_candidate8_semantics.py
          git diff --check
