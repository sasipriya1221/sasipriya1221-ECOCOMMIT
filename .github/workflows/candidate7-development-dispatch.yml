name: Candidate 7 - Development Qualification (Dispatcher)
run-name: Candidate 7 Dev ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Candidate-7 source commit SHA to qualify
        required: true
        type: string

concurrency:
  group: candidate7-development-dispatch-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Validate exact source input
        shell: python
        env:
          CANDIDATE7_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          import os, re
          sha = os.environ["CANDIDATE7_SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("source_sha must be an exact lowercase 40-hex commit SHA")

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact Candidate-7 source
        shell: python
        env:
          CANDIDATE7_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          import hashlib, json, os, subprocess
          expected = os.environ["CANDIDATE7_SOURCE_SHA"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected:
              raise SystemExit(f"checked out {actual}, expected {expected}")
          payload = {
              "candidate": "A-CANDIDATE-7",
              "candidate_sha": actual,
              "dispatcher_run_id": os.environ["GITHUB_RUN_ID"],
              "dispatcher_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "development_suite": "data/candidate6/development.json",
              "development_gold": "data/candidate6/development_gold.json",
              "official_checkpoint_a_cases_used": False,
              "holdout_opened": False,
          }
          raw = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          payload["binding_sha256"] = hashlib.sha256(raw).hexdigest()
          with open("/tmp/candidate7-source-binding.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Deterministic pre-provider gate
        run: |
          python -m pytest -p no:cacheprovider --basetemp .test-tmp-c7-dev
          python -m compileall -q src scripts tests
          git diff --check

      - name: Run 60-case Candidate-7 development qualification
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: python scripts/candidate7_qualify.py --output-dir artifacts/candidate7-development

      - name: Attach exact source binding to evidence
        if: always()
        run: |
          mkdir -p artifacts/candidate7-development
          cp /tmp/candidate7-source-binding.json artifacts/candidate7-development/source-binding.json

      - name: Preserve complete development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate7-development-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate7-development/
          if-no-files-found: warn
          retention-days: 30
