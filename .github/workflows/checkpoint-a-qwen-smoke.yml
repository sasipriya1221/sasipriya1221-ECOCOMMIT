name: Checkpoint A - Qwen Development Smoke

on:
  push:
    paths:
      - '.github/checkpoint-a-qwen-smoke-trigger'
  workflow_dispatch:

concurrency:
  group: checkpoint-a-qwen-development-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ECOCOMMIT_LLM_BASE_URL: https://api.groq.com/openai/v1
      ECOCOMMIT_LLM_MODEL: qwen/qwen3.6-27b
      ECOCOMMIT_LLM_REASONING_EFFORT: none
      ECOCOMMIT_LLM_JSON_SCHEMA: 'false'
      ECOCOMMIT_LLM_MAX_COMPLETION_TOKENS: '1024'
      ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Offline regression suite
        run: pytest
      - name: Verify Groq secret exists
        shell: bash
        run: |
          if [ -z "$ECOCOMMIT_LLM_API_KEY" ]; then
            echo 'ECOCOMMIT_GROQ_API_KEY is not configured.' >&2
            exit 3
          fi
      - name: Run bounded Qwen JSON transport probe
        run: python scripts/checkpoint_a_transport_probe.py
