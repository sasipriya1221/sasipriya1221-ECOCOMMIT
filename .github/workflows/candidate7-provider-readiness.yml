name: Candidate 7 - Official A Provider Readiness
on:
  workflow_dispatch:
    inputs:
      preregistration_run_id: {required: true, type: string}
jobs:
  readiness:
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: main, path: supervisor, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: 12d121f80a6cacd94376c6d2b7bce7dff5212eb5, path: candidate, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Install exact dependencies
        working-directory: supervisor
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: checkpoint-a-candidate7-preregistration-${{ inputs.preregistration_run_id }}, run-id: "${{ inputs.preregistration_run_id }}", github-token: "${{ github.token }}", path: bundle}
      - name: Verify frozen preregistration
        run: >-
          python supervisor/scripts/checkpoint_a_candidate7_prereg.py --candidate-root candidate
          --binding bundle/source-binding.json --summary bundle/summary.json --qualification-artifact ignored
          --qualification-archive-sha256 aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          --verify bundle/checkpoint-a-candidate7-preregistration.json
      - name: Non-benchmark two-pass provider readiness
        env: {ECOCOMMIT_LLM_API_KEY: "${{ secrets.ECOCOMMIT_GROQ_API_KEY }}", PYTHONPATH: "candidate/src:supervisor/scripts"}
        run: python supervisor/scripts/checkpoint_a_candidate7_readiness.py --preregistration bundle/checkpoint-a-candidate7-preregistration.json --output readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: checkpoint-a-candidate7-provider-readiness-${{ github.run_id }}, path: readiness.json, if-no-files-found: error, retention-days: 30}
