name: Groq Provider Preflight

on:
  push:
    paths:
      - '.github/groq-preflight-trigger'
  workflow_dispatch:

concurrency:
  group: groq-provider-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ECOCOMMIT_LLM_BASE_URL: https://api.groq.com/openai/v1
      ECOCOMMIT_LLM_MODEL: openai/gpt-oss-120b
      ECOCOMMIT_LLM_REASONING_EFFORT: low
      ECOCOMMIT_LLM_JSON_SCHEMA: 'true'
      ECOCOMMIT_LLM_MAX_COMPLETION_TOKENS: '2048'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Offline regression suite
        run: pytest
      - name: Verify Groq secret exists
        shell: bash
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: |
          if [ -z "$ECOCOMMIT_LLM_API_KEY" ]; then
            echo 'ECOCOMMIT_GROQ_API_KEY is not configured.' >&2
            exit 3
          fi
      - name: Verify live provider contract with one request
        shell: python
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: |
          import os
          from ecocommit.interpreter import OpenAICompatibleIntentProvider
          from ecocommit.validator import FidelityValidator

          instruction = 'Buy 12 S17-certified bearings from Vendor A under ₹2 lakh within five days.'
          provider = OpenAICompatibleIntentProvider(
              os.environ['ECOCOMMIT_LLM_BASE_URL'],
              os.environ['ECOCOMMIT_LLM_API_KEY'],
              os.environ['ECOCOMMIT_LLM_MODEL'],
              timeout=60,
          )
          contract = provider.interpret(instruction)
          report = FidelityValidator().validate(contract)
          print('GROQ_PREFLIGHT_OK')
          print('CLAUSES', len(contract.clauses))
          print('STATUS', report.status.value)
