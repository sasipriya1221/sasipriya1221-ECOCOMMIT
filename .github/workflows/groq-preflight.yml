name: Groq Provider Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/groq-preflight.yml'

concurrency:
  group: groq-provider-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ECOCOMMIT_LLM_BASE_URL: https://api.groq.com/openai/v1
      ECOCOMMIT_LLM_MODEL: qwen/qwen3.6-27b
      ECOCOMMIT_LLM_REASONING_EFFORT: none
      ECOCOMMIT_LLM_JSON_SCHEMA: 'false'
      ECOCOMMIT_LLM_MAX_COMPLETION_TOKENS: '1024'
      ECOCOMMIT_CANDIDATE_ID: A-CANDIDATE-3
      ECOCOMMIT_CANDIDATE_SOURCE: fd26a52a21dc8431133c50be76d7d1ecaf0d099b
      ECOCOMMIT_CANDIDATE_MANIFEST_SHA256: 773cb2efef42c0b94491cb599cb5e0d0a361722fec566ba90fac9e595ee51934
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Offline regression suite
        run: pytest
      - name: Verify Groq secret exists
        shell: bash
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: |
          if [ -z "$ECOCOMMIT_LLM_API_KEY" ]; then
            echo 'ECOCOMMIT_GROQ_API_KEY is not configured.' >&2
            exit 3
          fi
      - name: Verify exact Candidate 3 provider configuration with one request
        shell: python
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: |
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from ecocommit.interpreter import OpenAICompatibleIntentProvider
          from ecocommit.validator import FidelityValidator

          instruction = 'Buy 12 S17-certified bearings from Vendor A under ₹2 lakh within five days.'
          provider = OpenAICompatibleIntentProvider(
              os.environ['ECOCOMMIT_LLM_BASE_URL'],
              os.environ['ECOCOMMIT_LLM_API_KEY'],
              os.environ['ECOCOMMIT_LLM_MODEL'],
              timeout=60,
          )
          contract = provider.interpret(instruction)
          report = FidelityValidator().validate(contract)

          receipt = {
              'schema_version': 1,
              'kind': 'ecocommit_provider_health_receipt',
              'candidate_id': os.environ['ECOCOMMIT_CANDIDATE_ID'],
              'candidate_source_sha': os.environ['ECOCOMMIT_CANDIDATE_SOURCE'],
              'candidate_manifest_sha256': os.environ['ECOCOMMIT_CANDIDATE_MANIFEST_SHA256'],
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'provider': {
                  'base_url': os.environ['ECOCOMMIT_LLM_BASE_URL'],
                  'model': os.environ['ECOCOMMIT_LLM_MODEL'],
                  'reasoning_effort': os.environ['ECOCOMMIT_LLM_REASONING_EFFORT'],
                  'json_schema': os.environ['ECOCOMMIT_LLM_JSON_SCHEMA'],
                  'max_completion_tokens': os.environ['ECOCOMMIT_LLM_MAX_COMPLETION_TOKENS'],
              },
              'observation': {
                  'healthy': True,
                  'validator_status': report.status.value,
                  'clause_count': len(contract.clauses),
              },
              'github': {
                  'repository': os.environ['GITHUB_REPOSITORY'],
                  'source_sha': os.environ['GITHUB_SHA'],
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              },
              'secret_material_retained': False,
              'model_output_retained': False,
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          receipt['receipt_sha256'] = hashlib.sha256(canonical).hexdigest()
          out = Path('artifacts/groq_candidate3_health_receipt.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True, ensure_ascii=False) + '\n', encoding='utf-8')
          print('GROQ_PREFLIGHT_OK')
          print('CANDIDATE', receipt['candidate_id'])
          print('MODEL', receipt['provider']['model'])
          print('RECEIPT_SHA256', receipt['receipt_sha256'])
      - name: Upload health receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkpoint-a-candidate-3-provider-health-${{ github.run_id }}
          path: artifacts/groq_candidate3_health_receipt.json
          if-no-files-found: error
