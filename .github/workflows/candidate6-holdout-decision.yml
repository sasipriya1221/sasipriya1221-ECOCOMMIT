name: Candidate 6 - Holdout Decision Receipt

on:
  workflow_dispatch:
    inputs:
      holdout_run_id:
        description: Completed one-shot Candidate-6 holdout dispatcher run ID
        required: true
        type: string
      frozen_ref:
        description: Exact frozen Candidate-6 commit used by the holdout
        required: true
        type: string

concurrency:
  group: candidate6-holdout-decision
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.frozen_ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact frozen project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify exact frozen source and freeze receipt
        shell: python
        env:
          FROZEN_REF: ${{ inputs.frozen_ref }}
          HOLDOUT_RUN_ID: ${{ inputs.holdout_run_id }}
        run: |
          import json, os, re, subprocess
          from pathlib import Path
          from ecocommit.candidate6_freeze import verify_freeze_receipt
          if not re.fullmatch(r'[0-9a-f]{40}', os.environ['FROZEN_REF']):
              raise SystemExit('frozen_ref must be exact 40-hex SHA')
          if not os.environ['HOLDOUT_RUN_ID'].isdigit():
              raise SystemExit('holdout_run_id must be numeric')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['FROZEN_REF']:
              raise SystemExit('holdout decision checkout mismatch')
          receipt = json.loads(Path('evidence/candidate6-freeze-receipt.json').read_text(encoding='utf-8'))
          verify_freeze_receipt(Path.cwd(), receipt)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate6-internal-holdout-${{ inputs.holdout_run_id }}-attempt-1
          run-id: ${{ inputs.holdout_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/holdout
      - name: Build mechanical internal qualification receipt
        shell: python
        env:
          FROZEN_REF: ${{ inputs.frozen_ref }}
          HOLDOUT_RUN_ID: ${{ inputs.holdout_run_id }}
        run: |
          import hashlib, json, os
          from pathlib import Path
          from ecocommit.candidate6_freeze import canonical_sha256

          root = Path('artifacts/holdout')
          aggregate_path = root / 'aggregate.json'
          binding_path = root / 'source-binding.json'
          if not aggregate_path.exists() or not binding_path.exists():
              raise SystemExit('holdout artifact is incomplete')
          aggregate = json.loads(aggregate_path.read_text(encoding='utf-8'))
          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          unsigned_binding = {k: v for k, v in binding.items() if k != 'binding_sha256'}
          if binding.get('binding_sha256') != canonical_sha256(unsigned_binding):
              raise SystemExit('holdout source binding digest mismatch')
          if binding.get('candidate') != 'A-CANDIDATE-6':
              raise SystemExit('holdout candidate identity mismatch')
          if binding.get('candidate_sha') != os.environ['FROZEN_REF']:
              raise SystemExit('holdout frozen source mismatch')
          if str(binding.get('dispatcher_run_id')) != os.environ['HOLDOUT_RUN_ID'] or binding.get('dispatcher_run_attempt') != 1:
              raise SystemExit('holdout run provenance mismatch')

          counts = aggregate.get('counts') if isinstance(aggregate.get('counts'), dict) else {}
          metrics = aggregate.get('metrics') if isinstance(aggregate.get('metrics'), dict) else {}
          complete = (
              aggregate.get('qualification_state') == 'COMPLETE'
              and aggregate.get('terminal_semantic_cases') == 60
              and aggregate.get('provider_deferred_cases') == 0
              and aggregate.get('stopped_early') is False
          )
          thresholds = (
              metrics.get('case_pass_rate', 0) >= 0.95
              and metrics.get('selective_semantic_reliability', 0) >= 0.97
              and metrics.get('autonomous_coverage', 0) >= 0.60
              and metrics.get('ambiguous_clarification_accuracy', 0) >= 0.90
          )
          safety = all(counts.get(key) == 0 for key in (
              'fail_open', 'dropped_guards', 'dropped_exceptions',
              'conservation_failures', 'unknown_authorized',
          ))
          passed = bool(complete and thresholds and safety and aggregate.get('passed') is True)
          if passed:
              status = 'PASS'
              decision = 'CANDIDATE 6 INTERNAL QUALIFICATION PASS'
              reason = 'ALL_INTERNAL_GATES_SATISFIED'
          else:
              status = 'FAILED'
              decision = 'CANDIDATE 6 FAILED INTERNAL QUALIFICATION'
              if aggregate.get('qualification_state') == 'PROVIDER_INCOMPLETE':
                  reason = 'PROVIDER_INCOMPLETE_ONE_SHOT_CANNOT_PASS_OR_RERUN'
              elif not complete:
                  reason = 'INTERNAL_RUN_INCOMPLETE_OR_STOPPED'
              elif not thresholds:
                  reason = 'INTERNAL_THRESHOLD_NOT_MET'
              elif not safety:
                  reason = 'INTERNAL_SAFETY_INVARIANT_FAILED'
              else:
                  reason = 'INTERNAL_PASS_NOT_PROVEN'

          receipt = {
              'schema_version': 'C6.INTERNAL.RECEIPT.1',
              'stage': 'holdout',
              'candidate': 'A-CANDIDATE-6',
              'frozen_ref': os.environ['FROZEN_REF'],
              'holdout_run_id': int(os.environ['HOLDOUT_RUN_ID']),
              'holdout_run_attempt': 1,
              'qualification_state': aggregate.get('qualification_state'),
              'status': status,
              'passed': passed,
              'decision': decision,
              'official_checkpoint_a_eligibility': 'ELIGIBLE' if passed else 'NOT_ELIGIBLE',
              'reason': reason,
              'terminal_semantic_cases': aggregate.get('terminal_semantic_cases'),
              'provider_deferred_cases': aggregate.get('provider_deferred_cases'),
              'metrics': metrics,
              'counts': counts,
              'thresholds': {
                  'case_pass_rate': 0.95,
                  'selective_semantic_reliability': 0.97,
                  'autonomous_coverage': 0.60,
                  'ambiguous_clarification_accuracy': 0.90,
                  'fail_open': 0,
                  'dropped_guards': 0,
                  'dropped_exceptions': 0,
                  'conservation_failures': 0,
                  'unknown_authorized': 0,
              },
              'holdout_aggregate_sha256': hashlib.sha256(aggregate_path.read_bytes()).hexdigest(),
              'holdout_source_binding_sha256': hashlib.sha256(binding_path.read_bytes()).hexdigest(),
              'holdout_rerun_permitted': False,
              'post_holdout_semantic_modification_permitted': False,
          }
          receipt['receipt_sha256'] = canonical_sha256(receipt)
          Path('/tmp/candidate6-internal-qualification-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
      - name: Commit immutable internal qualification decision
        id: commit_decision
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          FROZEN_REF: ${{ inputs.frozen_ref }}
        run: |
          import base64, json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base = 'https://api.github.com/repos/' + repo
          def request_json(method, path, payload=None):
              data = None if payload is None else json.dumps(payload, separators=(',', ':')).encode()
              req = Request(base + path, data=data, headers={'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method=method)
              req.add_unredirected_header('Authorization', 'Bearer ' + token)
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != req.full_url:
                      raise SystemExit('GitHub write redirect rejected')
                  return json.load(response) if response.status != 204 else {}
          branch = request_json('GET', '/branches/candidate6-internal-qualification')
          if branch['commit']['sha'] != os.environ['FROZEN_REF']:
              raise SystemExit('Candidate-6 branch changed after freeze; decision commit refused')
          try:
              request_json('GET', '/contents/evidence/candidate6-internal-qualification-receipt.json?ref=candidate6-internal-qualification')
          except HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              raise SystemExit('internal qualification receipt already exists; duplicate decision refused')
          raw = Path('/tmp/candidate6-internal-qualification-receipt.json').read_bytes()
          result = request_json('PUT', '/contents/evidence/candidate6-internal-qualification-receipt.json', {
              'message': 'Record one-shot Candidate 6 internal qualification decision',
              'content': base64.b64encode(raw).decode(),
              'branch': 'candidate6-internal-qualification',
          })
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('decision_commit_sha=' + result['commit']['sha'] + '\n')
      - name: Preserve decision evidence
        if: always()
        run: |
          mkdir -p artifacts/decision
          test ! -f /tmp/candidate6-internal-qualification-receipt.json || cp /tmp/candidate6-internal-qualification-receipt.json artifacts/decision/
          printf '%s\n' '${{ steps.commit_decision.outputs.decision_commit_sha }}' > artifacts/decision/decision-commit-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: candidate6-holdout-decision-${{ github.run_id }}
          path: artifacts/decision/
          if-no-files-found: warn
          retention-days: 30
