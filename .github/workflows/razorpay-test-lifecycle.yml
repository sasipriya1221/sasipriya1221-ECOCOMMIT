name: Razorpay Test Order Boundary Validation

on:
  workflow_dispatch:
    inputs:
      confirm_test_mode:
        description: Create one INR 1.00 Razorpay Test Mode order (no real money)
        required: true
        type: choice
        options:
          - RUN_TEST_MODE_ORDER
      credential_preflight_run_id:
        description: Successful redacted credential-preflight run id
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  validate-order-api-boundary-without-capture-claim:
    if: inputs.confirm_test_mode == 'RUN_TEST_MODE_ORDER'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install the ECOCOMMIT validation snapshot
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify referenced credential preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          B8_PREFLIGHT_RUN_ID: ${{ inputs.credential_preflight_run_id }}
        run: |
          python scripts/checkpoint_b8_verify_preflight.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$B8_PREFLIGHT_RUN_ID" \
            --expected-sha "$GITHUB_SHA" \
            --output artifacts/checkpoint-b8-preflight-reference.json
      - name: Freeze pre-authorization certificate-key boundary provenance
        run: |
          python scripts/checkpoint_b8_prepare_provenance.py \
            --output artifacts/checkpoint-b8-certificate-key-reference.json \
            --source-revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Create, bind, fetch, and replay one Test Mode order
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          B8_PREFLIGHT_RUN_ID: ${{ inputs.credential_preflight_run_id }}
        run: |
          python scripts/checkpoint_b8_razorpay_live.py \
            --output artifacts/checkpoint-b8-razorpay-test.json \
            --preflight-receipt artifacts/checkpoint-b8-preflight-reference.json \
            --checkout-handoff artifacts/checkpoint-b8-checkout-handoff.json \
            --checkout-html artifacts/checkpoint-b8-test-checkout.html
      - name: Publish only redacted validation facts
        if: always()
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/checkpoint-b8-razorpay-test.json")
          key_reference = Path("artifacts/checkpoint-b8-certificate-key-reference.json")
          if not path.is_file():
              raise SystemExit("B8 evidence file was not produced")
          if not key_reference.is_file():
              raise SystemExit("B8 certificate-key reference was not produced")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          reference = json.loads(key_reference.read_text(encoding="utf-8"))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# ECOCOMMIT B8 — Razorpay Test Mode\n\n")
              summary.write(f"- Validation status: `{evidence['status']}`\n")
              summary.write(f"- B8 passed: `{evidence['checkpoint_b8_passed']}`\n")
              summary.write(f"- Credential preflight run: `{evidence['github']['credential_preflight_run_id']}`\n")
              summary.write(
                  f"- Preflight run API-verified at this source revision: "
                  f"`{evidence['authentication']['credential_preflight_run_verified']}`\n"
              )
              summary.write(
                  "- Certificate-key boundary frozen before Razorpay order call: "
                  f"`{reference.get('source_revision') == os.environ.get('GITHUB_SHA')}`\n"
              )
              summary.write("- Certificate key material retained: `false`\n")
              order = evidence.get("order", {})
              summary.write(f"- Test order created: `{order.get('executed', False)}`\n")
              if order.get("order_id"):
                  summary.write(f"- Order id: `{order['order_id']}`\n")
              summary.write(f"- Amount/currency: `{order.get('amount_minor')}` / `{order.get('currency')}`\n")
              summary.write(
                  f"- Provider create calls after identical replay: "
                  f"`{evidence.get('idempotency', {}).get('provider_create_order_post_count')}`\n"
              )
              summary.write(
                  f"- Payments attached to order: "
                  f"`{evidence.get('payments_for_order', {}).get('count')}`\n"
              )
              summary.write(f"- Capture executed: `{evidence.get('capture', {}).get('executed')}`\n")
              summary.write(
                  f"- Human Checkout handoff generated: "
                  f"`{evidence.get('checkout_handoff', {}).get('generated', False)}`\n"
              )
              blocker = evidence.get("external_blocker") or {}
              summary.write(f"- Exact blocker: `{blocker.get('code')}`\n")
              summary.write("- Credential values and provider response bodies: not retained\n")
      - name: Retain redacted B8 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkpoint-b8-razorpay-test-evidence-${{ github.run_id }}
          path: |
            artifacts/checkpoint-b8-preflight-reference.json
            artifacts/checkpoint-b8-certificate-key-reference.json
            artifacts/checkpoint-b8-razorpay-test.json
            artifacts/checkpoint-b8-checkout-handoff.json
            artifacts/checkpoint-b8-test-checkout.html
          if-no-files-found: error
          retention-days: 30
