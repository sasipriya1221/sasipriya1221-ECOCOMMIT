name: Candidate 7 - D003 Pass2 Diagnostic Incremental

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/candidate7-diagnostic-d003-incremental.yml

jobs:
  resample-d003:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: de37b994ae32c9cbb2d3dadb10fb2e0d240ad83b
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Confirm deterministic baseline
        run: python -m pytest -p no:cacheprovider --basetemp .test-tmp-c7-d003-diag
      - name: Resample D003 Pass-2 five times with incremental writes
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        shell: python
        run: |
          import json, os, time
          from pathlib import Path
          from ecocommit.candidate7_flat import LabeledFact, RelationBatch, drop_ungrounded_relations, validate_relations
          from ecocommit.candidate7_provider import GroqCandidate7Provider, PASS2_SYSTEM_PROMPT

          out = Path('artifacts/candidate7-d003-diagnostic')
          out.mkdir(parents=True, exist_ok=True)
          samples_path = out / 'samples.jsonl'
          progress_path = out / 'progress.json'
          provider = GroqCandidate7Provider(os.environ['ECOCOMMIT_LLM_API_KEY'], min_request_interval_seconds=5.0)

          instruction = 'Pay printer exactly ₹32,500 for completed run.'
          frozen_facts = [
              {'id':'F0001','text_span':{'quote':'Pay','occurrence':1},'kind':'ACTION','polarity':'POSITIVE','action_type':'PAY'},
              {'id':'F0002','text_span':{'quote':'printer','occurrence':1},'kind':'ENTITY','polarity':'POSITIVE','action_type':None},
              {'id':'F0003','text_span':{'quote':'exactly ₹32,500','occurrence':1},'kind':'CONSTRAINT','polarity':'POSITIVE','action_type':None},
              {'id':'F0004','text_span':{'quote':'completed run','occurrence':1},'kind':'ENTITY','polarity':'POSITIVE','action_type':None},
          ]
          facts = tuple(LabeledFact.model_validate(x) for x in frozen_facts)
          labeled_payload = [f.model_dump(mode='json') for f in facts]
          base = [
              {'role':'system','content':PASS2_SYSTEM_PROMPT},
              {'role':'user','content':json.dumps({'instruction':instruction,'facts':labeled_payload},separators=(',',':'))},
          ]
          original_signature = {
              ('ACTION_COUNTERPARTY','F0001','F0002'),
              ('CONSTRAINT_APPLIES_TO','F0003','F0001'),
              ('ACTION_OBJECT','F0001','F0004'),
          }

          def append_jsonl(obj):
              with samples_path.open('a', encoding='utf-8') as fh:
                  fh.write(json.dumps(obj, sort_keys=True, ensure_ascii=False) + '\n')
                  fh.flush(); os.fsync(fh.fileno())

          def write_progress(done):
              tmp = progress_path.with_suffix('.tmp')
              tmp.write_text(json.dumps({'case_id':'D003','completed_samples':done,'target_samples':5}, indent=2), encoding='utf-8')
              os.replace(tmp, progress_path)

          write_progress(0)
          for sample in range(1, 6):
              def validate(parsed):
                  batch = RelationBatch.model_validate(parsed)
                  validate_relations(facts, batch)
                  return batch
              try:
                  raw_batch, trace = provider._run_stage('relations', base, validate)
                  kept, drops = drop_ungrounded_relations(instruction, raw_batch)
                  sig = {(r.kind.value, r.left, r.right) for r in kept.relations}
                  row = {
                      'sample': sample,
                      'status': 'accepted',
                      'raw_relation_batch': raw_batch.model_dump(mode='json'),
                      'kept_relation_batch': kept.model_dump(mode='json'),
                      'drops': list(drops),
                      'trace': trace,
                      'matches_original_failure_signature': sig == original_signature,
                  }
              except Exception as exc:
                  row = {'sample':sample,'status':'error','error':str(exc),'matches_original_failure_signature':False}
              append_jsonl(row)
              write_progress(sample)
              time.sleep(1)
      - name: Upload incremental D003 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate7-d003-diagnostic-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate7-d003-diagnostic/
          if-no-files-found: warn
          retention-days: 30
