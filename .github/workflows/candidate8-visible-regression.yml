name: Candidate 8 - Visible Regression

on:
  workflow_dispatch:

concurrency:
  group: candidate8-visible-regression-frozen-850a7b5f
  cancel-in-progress: false

jobs:
  visible_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out frozen Candidate-8 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: 850a7b5f1f21d7951cd4a9a840c0bebbb635d594
          fetch-depth: 1
          persist-credentials: false

      - name: Bind frozen source and visible-development PASS
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path

          expected = '850a7b5f1f21d7951cd4a9a840c0bebbb635d594'
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != expected:
              raise SystemExit(f'frozen source mismatch: {actual}')
          payload = {
              'candidate': 'A-CANDIDATE-8',
              'mode': 'VISIBLE_REGRESSION',
              'partition': 'regression',
              'source_sha': actual,
              'provider': 'Groq',
              'model': 'qwen/qwen3.6-27b',
              'max_completion_tokens': 900,
              'temperature': 0,
              'reasoning_effort': 'none',
              'development_pass_run_id': '34322382314',
              'development_pass_run_attempt': 1,
              'development_artifact_id': '10093914827',
              'development_artifact_digest': 'sha256:b2ce264c2df986adbe9e41e97b3484200b71d4fa519dafac479b50815e2249b4',
              'development_summary_sha256': '24fc8854a05fff78bef9f24719c919f464c1501bf4965857608d8d1486c6a028',
              'regression_dataset_sha256': 'd086f3e9a8b62efcb498eb243496d6aa59bad93c6cfd499835db8af0a914ce00',
              'regression_gold_sha256': 'ec53f37d2475a42eab1f243412ca6a3450c33a4d4a56030fe929a0cadc8241d3',
              'pass1_prompt_sha256': '1cb84e6390e46bc3526caa6bf32376d17b115ad927d5ea1946f6459b6681b26e',
              'pass2_prompt_sha256': '1c583d515793557d23a5c061850b641d43650fda384912d9588ce148b520dc23',
              'evaluator_sha256': 'cac4226b7a8ebb0db8adcd3d93a61dd4c3c4815aff28bb51a102fa3a9fce5316',
              'development_passed': True,
              'sealed_preflight': False,
              'formal_qualification': False,
              'official_checkpoint_a_cases_used': False,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['binding_sha256'] = hashlib.sha256(canonical).hexdigest()
          out = Path('artifacts/candidate8-visible-regression')
          out.mkdir(parents=True, exist_ok=False)
          (out / 'binding.json').write_text(json.dumps(payload, indent=2, sort_keys=True), encoding='utf-8')

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Verify frozen regression inputs and implementation
        run: |
          echo 'd086f3e9a8b62efcb498eb243496d6aa59bad93c6cfd499835db8af0a914ce00  data/candidate8-development/regression.json' | sha256sum --check --strict
          echo 'ec53f37d2475a42eab1f243412ca6a3450c33a4d4a56030fe929a0cadc8241d3  data/candidate8-development/regression_gold.json' | sha256sum --check --strict
          echo 'b2afe486b52bd88619910206d1e207952bb94514deb3d96e4f968b0f95c3a095  scripts/candidate8_develop.py' | sha256sum --check --strict
          echo 'cac4226b7a8ebb0db8adcd3d93a61dd4c3c4815aff28bb51a102fa3a9fce5316  src/ecocommit/candidate7_evaluator.py' | sha256sum --check --strict
          echo '9ee661b1de9965b824e8713a44d92f7ec0b503372d4da1f95daacc1430bc0267  src/ecocommit/candidate8_provider.py' | sha256sum --check --strict
          echo '6147d81f8472d3602f6a3c84cf89935a8e76092f3977633aff6fe1db7ea06401  src/ecocommit/candidate8_normalize.py' | sha256sum --check --strict
          python -m pytest tests/test_candidate8_semantics.py -p no:cacheprovider --basetemp .test-tmp-c8-regression
          git diff --check

      - name: Run visible Candidate-8 regression partition once
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: python scripts/candidate8_develop.py --partition regression --output-dir artifacts/candidate8-visible-regression/iteration

      - name: Validate semantic artifact identity
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('artifacts/candidate8-visible-regression/iteration/summary.json')
          if not path.exists():
              raise SystemExit('visible regression summary missing')
          summary = json.loads(path.read_text(encoding='utf-8'))
          if summary.get('source_sha') != '850a7b5f1f21d7951cd4a9a840c0bebbb635d594':
              raise SystemExit('summary source mismatch')
          if summary.get('partition') != 'regression':
              raise SystemExit('summary partition mismatch')
          expected = {
              'provider': 'Groq',
              'model': 'qwen/qwen3.6-27b',
              'max_completion_tokens': 900,
              'temperature': 0,
              'reasoning_effort': 'none',
              'pass1_prompt_sha256': '1cb84e6390e46bc3526caa6bf32376d17b115ad927d5ea1946f6459b6681b26e',
              'pass2_prompt_sha256': '1c583d515793557d23a5c061850b641d43650fda384912d9588ce148b520dc23',
              'dataset_sha256': 'd086f3e9a8b62efcb498eb243496d6aa59bad93c6cfd499835db8af0a914ce00',
              'gold_sha256': 'ec53f37d2475a42eab1f243412ca6a3450c33a4d4a56030fe929a0cadc8241d3',
          }
          for key, value in expected.items():
              if summary.get(key) != value:
                  raise SystemExit(f'summary configuration mismatch: {key}')

      - name: Preserve complete visible-regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate8-visible-regression-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate8-visible-regression/
          if-no-files-found: error
          retention-days: 30
