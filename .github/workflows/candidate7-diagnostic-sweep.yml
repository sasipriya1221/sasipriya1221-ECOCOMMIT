name: Candidate 7 - Diagnostic Sweep

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE7_SOURCE_SHA: de37b994ae32c9cbb2d3dadb10fb2e0d240ad83b

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE7_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Confirm deterministic baseline
        run: python -m pytest -p no:cacheprovider --basetemp .test-tmp-c7-diag

  part_a:
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE7_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run all-60 Pass-1 sweep with incremental persistence
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          from ecocommit.candidate7_compile import _constraint_kind_v2
          from ecocommit.candidate7_flat import FactBatch, FactKind, assign_fact_ids, grounded_span
          from ecocommit.candidate7_provider import GroqCandidate7Provider, PASS1_SYSTEM_PROMPT
          from ecocommit.candidate7_structure import _action_kind

          out = Path('artifacts/candidate7-diagnostic-part-a')
          out.mkdir(parents=True, exist_ok=True)
          jsonl = out / 'part-a.jsonl'
          suite = json.loads(Path('data/candidate6/development.json').read_text())['cases']
          gold_rows = json.loads(Path('data/candidate6/development_gold.json').read_text())['cases']
          gold = {r['case_id']: r for r in gold_rows}
          provider = GroqCandidate7Provider(os.environ['ECOCOMMIT_LLM_API_KEY'], min_request_interval_seconds=5.0)

          def append(row):
              with jsonl.open('a', encoding='utf-8') as fh:
                  fh.write(json.dumps(row, sort_keys=True, ensure_ascii=False) + '\n')
                  fh.flush()
                  os.fsync(fh.fileno())

          def run_pass1(instruction):
              base = [
                  {'role':'system','content':PASS1_SYSTEM_PROMPT},
                  {'role':'user','content':json.dumps({'instruction':instruction},separators=(',',':'),ensure_ascii=False)},
              ]
              def validate(parsed):
                  provider._validate_action_types_raw(parsed)
                  batch = FactBatch.model_validate(parsed)
                  labeled = assign_fact_ids(batch)
                  for fact in labeled:
                      grounded_span(instruction, fact.text_span)
                      if fact.kind is FactKind.ACTION and fact.action_type != _action_kind(fact.text_span.quote):
                          raise ValueError('C7_ACTION_TYPE_SPAN_MISMATCH')
                  return labeled
              return provider._run_stage('facts', base, validate)

          currency_re = re.compile(r'(₹|\b(?:rupees?|inr|rs\.?)\b)', re.I)
          bare_number_re = re.compile(r'^\s*[+-]?\d[\d,]*(?:\.\d+)?\s*$')
          monetary_context_re = re.compile(r'\b(?:pay|payment|spend|cost|price|fee|budget|amount|transfer)\b|₹|\b(?:rupees?|inr|rs\.?)\b', re.I)

          def currency_shaped_entity(instruction, text):
              if currency_re.search(text):
                  return True
              if not bare_number_re.fullmatch(text):
                  return False
              pos = instruction.find(text)
              if pos < 0:
                  return False
              window = instruction[max(0,pos-40):pos+len(text)+40]
              return bool(monetary_context_re.search(window))

          for case_id, instruction in suite:
              row = {'case_id':case_id, 'instruction':instruction}
              try:
                  facts, trace = run_pass1(instruction)
                  row['status'] = 'accepted'
                  row['facts'] = [f.model_dump(mode='json') for f in facts]
                  row['trace'] = trace
                  unsupported = []
                  currency_entities = []
                  g = gold[case_id]['gold_semantic_ir']
                  for fact in facts:
                      text = fact.text_span.quote
                      if fact.kind is FactKind.CONSTRAINT:
                          try:
                              _constraint_kind_v2(text)
                          except Exception:
                              unsupported.append(text)
                      if fact.kind is FactKind.ENTITY and currency_shaped_entity(instruction, text):
                          compact = text.replace(',','')
                          nums = re.findall(r'\d+(?:\.\d+)?', compact)
                          expected_constraints = g.get('constraints', [])
                          expected_as_constraint = any(nums and nums[-1] == str(amount) for _, amount in expected_constraints)
                          object_terms = {t.lower() for a in g.get('actions',[]) for t in a.get('object_terms',[])}
                          entity_tokens = set(re.findall(r'[a-z0-9]+', text.lower()))
                          expected_as_entity = bool(object_terms and object_terms <= entity_tokens)
                          currency_entities.append({
                              'text_span': text,
                              'gold_expected_as_constraint': expected_as_constraint,
                              'gold_expected_as_entity_object': expected_as_entity,
                              'gold_semantic_ir': g,
                          })
                  row['unsupported_nonmonetary_nontemporal_constraints'] = unsupported
                  row['currency_entities'] = currency_entities
              except Exception as exc:
                  row['status'] = 'provider_or_validation_failure'
                  row['error'] = str(exc)
              append(row)
      - name: Upload Part-A evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate7-diagnostic-part-a-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate7-diagnostic-part-a/
          if-no-files-found: warn
          retention-days: 30

  d003:
    needs: [baseline, part_a]
    if: ${{ always() && needs.baseline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE7_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Resample D003 Pass-2 five times with incremental persistence
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        shell: python
        run: |
          import json, os, time
          from pathlib import Path
          from ecocommit.candidate7_flat import LabeledFact, RelationBatch, drop_ungrounded_relations, validate_relations
          from ecocommit.candidate7_provider import GroqCandidate7Provider, PASS2_SYSTEM_PROMPT

          out = Path('artifacts/candidate7-diagnostic-d003')
          out.mkdir(parents=True, exist_ok=True)
          jsonl = out / 'd003.jsonl'
          instruction = 'Pay printer exactly ₹32,500 for completed run.'
          frozen = [
              {'id':'F0001','text_span':{'quote':'Pay','occurrence':1},'kind':'ACTION','polarity':'POSITIVE','action_type':'PAY'},
              {'id':'F0002','text_span':{'quote':'printer','occurrence':1},'kind':'ENTITY','polarity':'POSITIVE','action_type':None},
              {'id':'F0003','text_span':{'quote':'exactly ₹32,500','occurrence':1},'kind':'CONSTRAINT','polarity':'POSITIVE','action_type':None},
              {'id':'F0004','text_span':{'quote':'completed run','occurrence':1},'kind':'ENTITY','polarity':'POSITIVE','action_type':None},
          ]
          facts = tuple(LabeledFact.model_validate(x) for x in frozen)
          provider = GroqCandidate7Provider(os.environ['ECOCOMMIT_LLM_API_KEY'], min_request_interval_seconds=5.0)
          base = [
              {'role':'system','content':PASS2_SYSTEM_PROMPT},
              {'role':'user','content':json.dumps({'instruction':instruction,'facts':[f.model_dump(mode='json') for f in facts]},separators=(',',':'),ensure_ascii=False)},
          ]

          def append(row):
              with jsonl.open('a', encoding='utf-8') as fh:
                  fh.write(json.dumps(row, sort_keys=True, ensure_ascii=False) + '\n')
                  fh.flush()
                  os.fsync(fh.fileno())

          def validate(parsed):
              batch = RelationBatch.model_validate(parsed)
              validate_relations(facts, batch)
              return batch

          for sample in range(1, 6):
              row = {'sample':sample}
              try:
                  raw_batch, trace = provider._run_stage('relations', base, validate)
                  kept, drops = drop_ungrounded_relations(instruction, raw_batch)
                  sig = {(r.kind.value, r.left, r.right) for r in kept.relations}
                  row.update({
                      'status':'accepted',
                      'raw_relation_batch':raw_batch.model_dump(mode='json'),
                      'kept_relation_batch':kept.model_dump(mode='json'),
                      'drops':list(drops),
                      'trace':trace,
                      'matches_original_failure_signature':
                          ('ACTION_COUNTERPARTY','F0001','F0002') in sig and
                          ('ACTION_OBJECT','F0001','F0004') in sig,
                  })
              except Exception as exc:
                  row.update({'status':'provider_or_validation_failure','error':str(exc)})
              append(row)
              time.sleep(1)
      - name: Upload D003 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate7-diagnostic-d003-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate7-diagnostic-d003/
          if-no-files-found: warn
          retention-days: 30

  d009:
    needs: [baseline, d003]
    if: ${{ always() && needs.baseline.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CANDIDATE7_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Resample D009 Pass-2 five times with incremental persistence
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        shell: python
        run: |
          import json, os, time
          from pathlib import Path
          from ecocommit.candidate7_flat import LabeledFact, RelationBatch, drop_ungrounded_relations, validate_relations
          from ecocommit.candidate7_provider import GroqCandidate7Provider, PASS2_SYSTEM_PROMPT

          out = Path('artifacts/candidate7-diagnostic-d009')
          out.mkdir(parents=True, exist_ok=True)
          jsonl = out / 'd009.jsonl'
          instruction = 'Order 500 envelopes only if warehouse count below 100.'
          frozen = [
              {'id':'F0001','text_span':{'quote':'Order 500 envelopes','occurrence':1},'kind':'ACTION','polarity':'POSITIVE','action_type':'ORDER'},
              {'id':'F0002','text_span':{'quote':'500 envelopes','occurrence':1},'kind':'ENTITY','polarity':'POSITIVE','action_type':None},
              {'id':'F0003','text_span':{'quote':'warehouse count below 100','occurrence':1},'kind':'PREDICATE','polarity':'POSITIVE','action_type':None},
          ]
          facts = tuple(LabeledFact.model_validate(x) for x in frozen)
          provider = GroqCandidate7Provider(os.environ['ECOCOMMIT_LLM_API_KEY'], min_request_interval_seconds=5.0)
          base = [
              {'role':'system','content':PASS2_SYSTEM_PROMPT},
              {'role':'user','content':json.dumps({'instruction':instruction,'facts':[f.model_dump(mode='json') for f in facts]},separators=(',',':'),ensure_ascii=False)},
          ]

          def append(row):
              with jsonl.open('a', encoding='utf-8') as fh:
                  fh.write(json.dumps(row, sort_keys=True, ensure_ascii=False) + '\n')
                  fh.flush()
                  os.fsync(fh.fileno())

          def validate(parsed):
              batch = RelationBatch.model_validate(parsed)
              validate_relations(facts, batch)
              return batch

          for sample in range(1, 6):
              row = {'sample':sample}
              try:
                  raw_batch, trace = provider._run_stage('relations', base, validate)
                  kept, drops = drop_ungrounded_relations(instruction, raw_batch)
                  sig = {(r.kind.value, r.left, r.right) for r in kept.relations}
                  has_object = ('ACTION_OBJECT','F0001','F0002') in sig
                  row.update({
                      'status':'accepted',
                      'raw_relation_batch':raw_batch.model_dump(mode='json'),
                      'kept_relation_batch':kept.model_dump(mode='json'),
                      'drops':list(drops),
                      'trace':trace,
                      'matches_original_failure_signature': not has_object,
                  })
              except Exception as exc:
                  row.update({'status':'provider_or_validation_failure','error':str(exc)})
              append(row)
              time.sleep(1)
      - name: Upload D009 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate7-diagnostic-d009-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate7-diagnostic-d009/
          if-no-files-found: warn
          retention-days: 30
