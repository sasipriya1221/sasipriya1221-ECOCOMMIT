name: Candidate 7 - D003 D009 Readiness

on:
  push:
    branches: [candidate7-structural-semantic-fix]
    paths:
      - .github/workflows/candidate7-diagnostic-sweep.yml
      - .github/workflows/candidate6-development.yml
      - scripts/candidate7_pass2_qualification.py

permissions:
  contents: read
  actions: write

jobs:
  phase0_readiness:
    name: Phase 0 - readiness only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Complete deterministic suite
        run: python -m pytest -p no:cacheprovider --basetemp .test-tmp-c7-qual-readiness
      - name: Static runtime checks
        run: |
          python -m compileall -q src scripts tests
          node --check ui/app.js
          git diff --check
      - name: Mocked qualification harness self-check
        run: python scripts/candidate7_pass2_qualification.py self-check

  phase1_dispatch:
    name: Phase 1 - dispatch frozen qualification once
    needs: phase0_readiness
    if: ${{ needs.phase0_readiness.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exactly one manual secret-bearing qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run candidate6-development.yml --repo "${{ github.repository }}" --ref candidate7-structural-semantic-fix -f mode=candidate7-d003-d009
