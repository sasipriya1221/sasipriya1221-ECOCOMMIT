name: Candidate 6 - Official Frozen Checkpoint A

on:
  workflow_dispatch:
    inputs:
      provider_readiness_run_id:
        description: Successful Candidate-6 non-benchmark provider readiness run ID
        required: true
        type: string
      provider_readiness_run_attempt:
        description: Exact successful provider readiness run attempt
        required: true
        type: string

concurrency:
  group: candidate6-official-frozen-checkpoint-a
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          path: supervisor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: candidate6-internal-qualification
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache-dependency-path: candidate/requirements-dev.lock
      - name: Enforce one-shot official workflow attempt
        run: |
          test "${GITHUB_RUN_ATTEMPT}" = "1" || { echo 'Candidate-6 official Checkpoint-A reruns are forbidden'; exit 1; }
      - name: Install exact candidate dependencies
        working-directory: candidate
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run exact-source deterministic gate
        run: |
          python -m pytest -p no:cacheprovider --basetemp .test-tmp-official-a
          python -m compileall -q supervisor/scripts candidate/src
          git -C supervisor diff --check
          git -C candidate diff --check
      - name: Verify preregistration and readiness workflow provenance
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          READINESS_RUN_ID: ${{ inputs.provider_readiness_run_id }}
          READINESS_RUN_ATTEMPT: ${{ inputs.provider_readiness_run_attempt }}
        run: |
          import json, os
          from urllib.request import Request, urlopen
          run_id = os.environ['READINESS_RUN_ID']; attempt = os.environ['READINESS_RUN_ATTEMPT']
          if not run_id.isdigit() or not attempt.isdigit() or int(attempt) < 1:
              raise SystemExit('invalid provider readiness run binding')
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          req = Request(base + '/actions/runs/' + run_id, headers={'Accept': 'application/vnd.github+json'})
          req.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
          with urlopen(req, timeout=30) as response:
              if response.geturl() != req.full_url: raise SystemExit('GitHub evidence redirect rejected')
              run = json.load(response)
          if not (
              run.get('name') == 'Candidate 6 - Official A Provider Readiness'
              and run.get('conclusion') == 'success'
              and str(run.get('run_attempt')) == attempt
          ):
              raise SystemExit('successful Candidate-6 provider readiness run required')
      - name: Verify frozen preregistration offline
        env:
          PYTHONPATH: candidate/src:supervisor/scripts
        run: >-
          python supervisor/scripts/checkpoint_a_candidate6.py
          --candidate-root candidate
          --preregistration candidate/evidence/checkpoint-a-candidate6-preregistration.json
          --verify-offline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checkpoint-a-candidate6-provider-readiness-${{ inputs.provider_readiness_run_id }}-attempt-${{ inputs.provider_readiness_run_attempt }}
          run-id: ${{ inputs.provider_readiness_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/readiness
      - name: Run exactly one frozen 80-case Candidate-6 Checkpoint-A attempt
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
          PYTHONPATH: candidate/src:supervisor/scripts
        run: >-
          python supervisor/scripts/checkpoint_a_candidate6.py
          --candidate-root candidate
          --preregistration candidate/evidence/checkpoint-a-candidate6-preregistration.json
          --provider-readiness artifacts/readiness/candidate6-provider-readiness.json
          --output-dir artifacts/checkpoint-a-candidate6
      - name: Preserve permanent official result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkpoint-a-candidate6-official-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/checkpoint-a-candidate6/
          if-no-files-found: warn
          retention-days: 30
