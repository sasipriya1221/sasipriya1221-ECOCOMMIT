name: Candidate 6 - Freeze and Holdout Handoff

on:
  workflow_dispatch:
    inputs:
      development_run_id:
        description: Completed Candidate-6 development dispatcher run ID
        required: true
        type: string
      development_run_attempt:
        description: Exact development run attempt number
        required: true
        type: string
      candidate_sha:
        description: Exact Candidate-6 semantic source SHA proven by development evidence
        required: true
        type: string

concurrency:
  group: candidate6-freeze-and-holdout-handoff
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify pre-freeze repository state
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
          DEVELOPMENT_RUN_ATTEMPT: ${{ inputs.development_run_attempt }}
        run: |
          import json, os, re, subprocess
          from urllib.request import Request, urlopen

          sha = os.environ['CANDIDATE_SHA']
          run_id = os.environ['DEVELOPMENT_RUN_ID']
          run_attempt = os.environ['DEVELOPMENT_RUN_ATTEMPT']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('candidate_sha must be exact 40-hex SHA')
          if not run_id.isdigit() or not run_attempt.isdigit() or int(run_attempt) < 1:
              raise SystemExit('development run binding is invalid')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != sha:
              raise SystemExit('checked-out candidate SHA mismatch')

          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              req = Request(base + path, headers={'Accept': 'application/vnd.github+json'})
              req.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != req.full_url:
                      raise SystemExit('GitHub evidence redirect rejected')
                  return json.load(response)

          branch = get('/branches/candidate6-internal-qualification')
          if branch['commit']['sha'] != sha:
              raise SystemExit('Candidate-6 branch moved after development evidence; freeze refused')
          for workflow in ('candidate6-holdout.yml', 'candidate6-holdout-dispatch.yml'):
              runs = get('/actions/workflows/' + workflow + '/runs?per_page=1')
              if runs.get('total_count', 0) != 0:
                  raise SystemExit('Candidate-6 holdout has prior workflow history; one-shot freeze refused')

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate6-development-${{ inputs.development_run_id }}-attempt-${{ inputs.development_run_attempt }}
          run-id: ${{ inputs.development_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/development
      - name: Build and verify immutable freeze receipt
        shell: python
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DEVELOPMENT_RUN_ID: ${{ inputs.development_run_id }}
          DEVELOPMENT_RUN_ATTEMPT: ${{ inputs.development_run_attempt }}
        run: |
          import hashlib, json, os
          from pathlib import Path
          from ecocommit.candidate6_freeze import build_bindings, canonical_sha256, verify_freeze_receipt

          root = Path.cwd()
          evidence = root / 'artifacts' / 'development'
          aggregate_path = evidence / 'aggregate.json'
          binding_path = evidence / 'source-binding.json'
          if not aggregate_path.exists() or not binding_path.exists():
              raise SystemExit('complete development aggregate and source binding are required')
          aggregate = json.loads(aggregate_path.read_text(encoding='utf-8'))
          binding = json.loads(binding_path.read_text(encoding='utf-8'))

          unsigned_binding = {k: v for k, v in binding.items() if k != 'binding_sha256'}
          if binding.get('binding_sha256') != canonical_sha256(unsigned_binding):
              raise SystemExit('development source binding digest mismatch')
          if binding.get('candidate') != 'A-CANDIDATE-6':
              raise SystemExit('development candidate identity mismatch')
          if binding.get('candidate_sha') != os.environ['CANDIDATE_SHA']:
              raise SystemExit('development evidence source SHA mismatch')
          if str(binding.get('dispatcher_run_id')) != os.environ['DEVELOPMENT_RUN_ID']:
              raise SystemExit('development evidence run ID mismatch')
          if str(binding.get('dispatcher_run_attempt')) != os.environ['DEVELOPMENT_RUN_ATTEMPT']:
              raise SystemExit('development evidence run attempt mismatch')

          if not (
              aggregate.get('qualification_state') == 'COMPLETE'
              and aggregate.get('passed') is True
              and aggregate.get('terminal_semantic_cases') == 60
              and aggregate.get('provider_deferred_cases') == 0
              and aggregate.get('stopped_early') is False
          ):
              raise SystemExit('development PASS is not mechanically proven')
          metrics = aggregate.get('metrics', {})
          if not (
              metrics.get('case_pass_rate', 0) >= 0.95
              and metrics.get('selective_semantic_reliability', 0) >= 0.97
              and metrics.get('autonomous_coverage', 0) >= 0.60
              and metrics.get('ambiguous_clarification_accuracy', 0) >= 0.90
          ):
              raise SystemExit('development thresholds are not all satisfied')
          counts = aggregate.get('counts', {})
          for key in ('fail_open', 'dropped_guards', 'dropped_exceptions', 'conservation_failures', 'unknown_authorized'):
              if counts.get(key) != 0:
                  raise SystemExit('development safety invariant failed: ' + key)

          receipt = {
              'candidate': 'A-CANDIDATE-6',
              'candidate_source_revision': os.environ['CANDIDATE_SHA'],
              'freeze_state': 'IMPLEMENTATION_FROZEN_BEFORE_HOLDOUT',
              'development_run_id': int(os.environ['DEVELOPMENT_RUN_ID']),
              'development_run_attempt': int(os.environ['DEVELOPMENT_RUN_ATTEMPT']),
              'development_aggregate_sha256': hashlib.sha256(aggregate_path.read_bytes()).hexdigest(),
              'development_source_binding_sha256': hashlib.sha256(binding_path.read_bytes()).hexdigest(),
              'holdout_provider_calls_before_freeze': 0,
              'official_benchmark_calls_before_freeze': 0,
              'holdout_qualification_executions_before_freeze': 0,
              **build_bindings(root),
          }
          receipt['freeze_receipt_sha256'] = canonical_sha256(receipt)
          verify_freeze_receipt(root, receipt)
          Path('/tmp/candidate6-freeze-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')

      - name: Commit freeze receipt without modifying frozen semantic artifacts
        id: commit_freeze
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          import base64, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base = 'https://api.github.com/repos/' + repo
          def request_json(method, path, payload=None):
              data = None if payload is None else json.dumps(payload, separators=(',', ':')).encode()
              req = Request(base + path, data=data, headers={'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method=method)
              req.add_unredirected_header('Authorization', 'Bearer ' + token)
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != req.full_url:
                      raise SystemExit('GitHub write redirect rejected')
                  return json.load(response) if response.status != 204 else {}

          branch = request_json('GET', '/branches/candidate6-internal-qualification')
          if branch['commit']['sha'] != os.environ['CANDIDATE_SHA']:
              raise SystemExit('Candidate-6 branch moved during freeze; commit refused')
          try:
              request_json('GET', '/contents/evidence/candidate6-freeze-receipt.json?ref=candidate6-internal-qualification')
          except Exception as exc:
              from urllib.error import HTTPError
              if not isinstance(exc, HTTPError) or exc.code != 404:
                  raise
          else:
              raise SystemExit('freeze receipt already exists; duplicate freeze refused')

          raw = Path('/tmp/candidate6-freeze-receipt.json').read_bytes()
          result = request_json('PUT', '/contents/evidence/candidate6-freeze-receipt.json', {
              'message': 'Freeze Candidate 6 before sealed internal holdout',
              'content': base64.b64encode(raw).decode(),
              'branch': 'candidate6-internal-qualification',
          })
          commit_sha = result['commit']['sha']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('receipt_commit_sha=' + commit_sha + '\n')

      - name: Dispatch sealed holdout exactly once
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_COMMIT_SHA: ${{ steps.commit_freeze.outputs.receipt_commit_sha }}
        run: |
          import json, os
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base = 'https://api.github.com/repos/' + repo
          def get(path):
              req = Request(base + path, headers={'Accept': 'application/vnd.github+json'})
              req.add_unredirected_header('Authorization', 'Bearer ' + token)
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != req.full_url:
                      raise SystemExit('GitHub evidence redirect rejected')
                  return json.load(response)
          runs = get('/actions/workflows/candidate6-holdout-dispatch.yml/runs?per_page=1')
          if runs.get('total_count', 0) != 0:
              raise SystemExit('holdout dispatcher already has run history; duplicate dispatch refused')
          payload = json.dumps({
              'ref': 'main',
              'inputs': {'candidate_ref': os.environ['RECEIPT_COMMIT_SHA']},
          }, separators=(',', ':')).encode()
          req = Request(base + '/actions/workflows/candidate6-holdout-dispatch.yml/dispatches', data=payload, headers={'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
          req.add_unredirected_header('Authorization', 'Bearer ' + token)
          with urlopen(req, timeout=30) as response:
              if response.geturl() != req.full_url or response.status != 204:
                  raise SystemExit('holdout dispatch failed')

      - name: Preserve freeze transition evidence
        if: always()
        run: |
          mkdir -p artifacts/freeze
          test ! -f /tmp/candidate6-freeze-receipt.json || cp /tmp/candidate6-freeze-receipt.json artifacts/freeze/candidate6-freeze-receipt.json
          printf '%s\n' '${{ steps.commit_freeze.outputs.receipt_commit_sha }}' > artifacts/freeze/receipt-commit-sha.txt
      - name: Upload freeze transition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate6-freeze-transition-${{ github.run_id }}
          path: artifacts/freeze/
          if-no-files-found: warn
          retention-days: 30
