name: Candidate 8 - Visible C8D020 Diagnostic

on:
  push:
    branches: [candidate8-development-clean]
    paths: [.github/candidate8-visible-diagnostic-trigger]

concurrency:
  group: candidate8-visible-c8d020-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and verify exact source
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pytest tests/test_candidate8_semantics.py -p no:cacheprovider --basetemp .test-tmp-c8-diagnostic
      - name: Run one visible diagnostic case
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: python scripts/candidate8_visible_diagnostic.py
      - name: Preserve sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate8-visible-c8d020-diagnostic-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate8-visible-diagnostic.json
          if-no-files-found: warn
          retention-days: 30
