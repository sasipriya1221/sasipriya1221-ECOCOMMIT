        run: sleep 3 && python scripts/candidate7_pass2_qualification.py run-attempt --case D009 --attempt 5 --output artifacts/candidate7-pass2-qualification/d009-5.json
      - name: Preserve D009 attempt 5
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate7-qual-d009-5-${{ github.run_id }}
          path: artifacts/candidate7-pass2-qualification/d009-5.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize qualification
        if: always()
        run: python scripts/candidate7_pass2_qualification.py summarize --directory artifacts/candidate7-pass2-qualification --output artifacts/candidate7-pass2-qualification/summary.json
      - name: Preserve complete Candidate-7 qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate7-pass2-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate7-pass2-qualification/
          if-no-files-found: warn
          retention-days: 30
