name: Candidate 6 - Development Qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification mode
        required: true
        default: candidate6-development
        type: choice
        options:
          - candidate6-development
          - candidate7-d003-d009

concurrency:
  group: candidate6-development
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ inputs.mode == 'candidate6-development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Deterministic pre-provider gate
        run: |
          python -m pytest -p no:cacheprovider --basetemp .test-tmp-c6-dev
          python -m compileall -q src scripts tests
          git diff --check
      - name: Run 60-case Candidate-6 development qualification
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: python scripts/candidate6_qualify.py --mode development --output-dir artifacts/candidate6-development
      - name: Preserve complete development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate6-development-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate6-development/
          if-no-files-found: warn
          retention-days: 30

  candidate7_frozen_qualification:
    if: ${{ inputs.mode == 'candidate7-d003-d009' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify frozen deterministic gate on dispatched commit
        run: |
          python -m pytest tests -p no:cacheprovider --basetemp .test-tmp-c7-frozen-qual
          python -m pytest diagnostic_tests/candidate7_qualification_harness_mock_tests.py -p no:cacheprovider --basetemp .test-tmp-c7-harness
          python -m compileall -q src scripts tests diagnostic_tests
          node --check ui/app.js
          git diff --check
          python scripts/candidate7_pass2_qualification.py self-check
      - name: Prepare evidence directory
        run: mkdir -p artifacts/candidate7-pass2-qualification
      - name: Run safe Candidate-7 qualification
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: python scripts/candidate7_pass2_qualification.py qualify --directory artifacts/candidate7-pass2-qualification
      - name: Preserve complete Candidate-7 qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate7-pass2-qualification-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate7-pass2-qualification/
          if-no-files-found: warn
          retention-days: 30
