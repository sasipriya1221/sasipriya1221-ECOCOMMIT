name: Candidate 6 - Official A Provider Readiness

on:
  workflow_dispatch:

concurrency:
  group: candidate6-official-a-provider-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          path: supervisor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: candidate6-internal-qualification
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache-dependency-path: candidate/requirements-dev.lock
      - name: Install exact candidate dependencies
        working-directory: candidate
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify committed preregistration and absence of official run history
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os
          from urllib.request import Request, urlopen
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          req = Request(base + '/actions/workflows/checkpoint-a-candidate6.yml/runs?per_page=1', headers={'Accept': 'application/vnd.github+json'})
          req.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
          with urlopen(req, timeout=30) as response:
              if response.geturl() != req.full_url: raise SystemExit('GitHub evidence redirect rejected')
              runs = json.load(response)
          if runs.get('total_count', 0) != 0: raise SystemExit('official Candidate-6 run history already exists; readiness refused')
      - name: Verify Candidate-6 official preregistration offline
        env:
          PYTHONPATH: candidate/src:supervisor/scripts
        run: >-
          python supervisor/scripts/checkpoint_a_candidate6_prereg.py
          --candidate-root candidate
          --verify candidate/evidence/checkpoint-a-candidate6-preregistration.json
      - name: Run one non-benchmark provider/schema/compile readiness probe
        shell: python
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
          PYTHONPATH: candidate/src:supervisor/scripts
        run: |
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          from checkpoint_a_candidate6_prereg import canonical_sha256, load_object
          from checkpoint_a_live import _ambiguous_cases, _clear_cases
          from ecocommit.candidate6_provider import GroqSemanticIRProvider
          from ecocommit.semantic_compiler import compile_contract

          instruction = 'Purchase two blue notebooks from Northwind Supplies for at most ₹900 total.'
          official = {g.instruction for g in (_clear_cases() + _ambiguous_cases())}
          dev = {row[1] for row in json.loads(Path('candidate/data/candidate6/development.json').read_text(encoding='utf-8'))['cases']}
          holdout = {row[1] for row in json.loads(Path('candidate/data/candidate6/holdout.json').read_text(encoding='utf-8'))['cases']}
          if instruction in official or instruction in dev or instruction in holdout:
              raise SystemExit('provider readiness instruction overlaps a qualification/benchmark case')

          prereg = load_object(Path('candidate/evidence/checkpoint-a-candidate6-preregistration.json'))
          candidate_head = subprocess.check_output(['git', '-C', 'candidate', 'rev-parse', 'HEAD'], text=True).strip()
          provider = GroqSemanticIRProvider(os.environ['ECOCOMMIT_LLM_API_KEY'])
          parsed = provider.parse_with_metadata(instruction)
          contract, _, _ = compile_contract(parsed.semantic_ir, instruction)
          receipt = {
              'schema_version': 'A.CANDIDATE6.PROVIDER.READINESS.1',
              'candidate': 'A-CANDIDATE-6',
              'candidate_evidence_revision': candidate_head,
              'frozen_semantic_source_revision': prereg['frozen_semantic_source_revision'],
              'preregistration_sha256': prereg['preregistration_sha256'],
              'healthy': True,
              'benchmark_cases_used': 0,
              'semantic_scoring_used': False,
              'probe_instruction_sha256': hashlib.sha256(instruction.encode('utf-8')).hexdigest(),
              'semantic_ir_sha256': canonical_sha256(parsed.semantic_ir.model_dump(mode='json')),
              'contract_sha256': contract.canonical_hash(),
              'provider_trace': list(parsed.provider_trace),
          }
          receipt['receipt_sha256'] = canonical_sha256(receipt)
          Path('/tmp/candidate6-provider-readiness.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkpoint-a-candidate6-provider-readiness-${{ github.run_id }}
          path: /tmp/candidate6-provider-readiness.json
          if-no-files-found: error
          retention-days: 30
