name: Candidate 6 - Internal Holdout Qualification (Dispatcher)

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Frozen Candidate-6 receipt commit SHA
        required: true
        type: string

concurrency:
  group: candidate6-internal-holdout-dispatch
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ inputs.candidate_ref }}
          persist-credentials: false
      - name: Enforce exact frozen commit input
        shell: python
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          import hashlib, json, os, re, subprocess
          ref = os.environ["CANDIDATE_REF"]
          if not re.fullmatch(r"[0-9a-f]{40}", ref):
              raise SystemExit("holdout candidate_ref must be exact 40-hex commit SHA")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != ref:
              raise SystemExit("checked-out SHA does not equal requested frozen commit")
          payload = {
              "candidate": "A-CANDIDATE-6",
              "candidate_sha": sha,
              "dispatcher_run_id": os.environ["GITHUB_RUN_ID"],
              "dispatcher_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          raw = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          payload["binding_sha256"] = hashlib.sha256(raw).hexdigest()
          with open("/tmp/candidate6-holdout-source-binding.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, sort_keys=True)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Enforce one-shot attempt
        run: test "${GITHUB_RUN_ATTEMPT}" = "1" || { echo 'Candidate-6 holdout reruns are forbidden'; exit 1; }
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Deterministic exact-source gate
        run: |
          python -m pytest -p no:cacheprovider --basetemp .test-tmp-c6-holdout
          python -m compileall -q src scripts tests
          git diff --check
      - name: Verify freeze receipt before opening holdout
        shell: python
        run: |
          import json
          from pathlib import Path
          from ecocommit.candidate6_freeze import verify_freeze_receipt
          root = Path.cwd()
          receipt_path = root / "evidence" / "candidate6-freeze-receipt.json"
          if not receipt_path.exists():
              raise SystemExit("freeze receipt missing")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          verify_freeze_receipt(root, receipt)
      - name: Run sealed 60-case internal holdout exactly once
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: python scripts/candidate6_qualify.py --mode holdout --output-dir artifacts/candidate6-holdout
      - name: Attach exact frozen source binding
        if: always()
        run: |
          mkdir -p artifacts/candidate6-holdout
          cp /tmp/candidate6-holdout-source-binding.json artifacts/candidate6-holdout/source-binding.json
      - name: Preserve complete holdout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate6-internal-holdout-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate6-holdout/
          if-no-files-found: warn
          retention-days: 30
