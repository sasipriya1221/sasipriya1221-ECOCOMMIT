name: Checkpoint A - Live Intent Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/checkpoint-a-trigger'

concurrency:
  group: checkpoint-a-live-gate
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Offline regression suite
        run: pytest

  shard:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: 0
            start: 0
            end: 5
          - shard: 1
            start: 5
            end: 10
          - shard: 2
            start: 10
            end: 15
          - shard: 3
            start: 15
            end: 20
          - shard: 4
            start: 20
            end: 25
          - shard: 5
            start: 25
            end: 30
          - shard: 6
            start: 30
            end: 35
          - shard: 7
            start: 35
            end: 40
          - shard: 8
            start: 40
            end: 45
          - shard: 9
            start: 45
            end: 50
          - shard: 10
            start: 50
            end: 55
          - shard: 11
            start: 55
            end: 60
          - shard: 12
            start: 60
            end: 65
          - shard: 13
            start: 65
            end: 70
          - shard: 14
            start: 70
            end: 75
          - shard: 15
            start: 75
            end: 80
    env:
      ECOCOMMIT_LLM_BASE_URL: https://api.groq.com/openai/v1
      ECOCOMMIT_LLM_MODEL: qwen/qwen3.6-27b
      ECOCOMMIT_LLM_REASONING_EFFORT: none
      ECOCOMMIT_LLM_JSON_SCHEMA: 'false'
      ECOCOMMIT_LLM_MAX_COMPLETION_TOKENS: '1024'
      ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Verify Groq secret exists
        shell: bash
        run: |
          if [ -z "$ECOCOMMIT_LLM_API_KEY" ]; then
            echo 'ECOCOMMIT_GROQ_API_KEY is not configured. Checkpoint A cannot be claimed with fixtures.' >&2
            exit 3
          fi
      - name: Restore prior shard artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: checkpoint-a-shard-${{ matrix.shard }}
          path: artifacts/resume
      - name: Run frozen benchmark shard
        run: >-
          python scripts/checkpoint_a_shard.py
          --start ${{ matrix.start }}
          --end ${{ matrix.end }}
          --output artifacts/shard-${{ matrix.shard }}.json
          --resume artifacts/resume/shard-${{ matrix.shard }}.json
      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-a-shard-${{ matrix.shard }}
          path: artifacts/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          overwrite: true

  aggregate:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: checkpoint-a-shard-*
          path: artifacts/shards
          merge-multiple: false
      - name: Aggregate frozen Checkpoint A result
        id: aggregate
        continue-on-error: true
        run: python scripts/checkpoint_a_aggregate.py --input-dir artifacts/shards --output artifacts/checkpoint_a_results.json
      - name: Print compact live diagnostics
        if: always()
        run: python scripts/checkpoint_a_diagnostics.py artifacts/checkpoint_a_results.json
      - name: Upload final evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-a-results
          path: artifacts/checkpoint_a_results.json
          if-no-files-found: warn
          overwrite: true
      - name: Enforce frozen gate
        if: steps.aggregate.outcome != 'success'
        run: exit 2
