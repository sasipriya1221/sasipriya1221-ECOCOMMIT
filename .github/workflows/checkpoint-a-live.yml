name: Checkpoint A - Live Intent Evaluation

on:
  workflow_dispatch:
    inputs:
      provider_preflight_run_id:
        description: Successful exact-source Candidate 5 Groq preflight run ID
        required: true
        type: string

concurrency:
  group: checkpoint-a-live-gate
  cancel-in-progress: false

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    env:
      ECOCOMMIT_LLM_BASE_URL: https://api.groq.com/openai/v1
      ECOCOMMIT_LLM_MODEL: qwen/qwen3.6-27b
      ECOCOMMIT_LLM_REASONING_EFFORT: none
      ECOCOMMIT_LLM_JSON_SCHEMA: 'false'
      ECOCOMMIT_LLM_MAX_COMPLETION_TOKENS: '2048'
      ECOCOMMIT_LLM_CASE_MAX_ATTEMPTS: '3'
      ECOCOMMIT_LLM_MAX_SCHEMA_CORRECTIONS: '2'
      ECOCOMMIT_LLM_CASE_MAX_RETRY_DELAY: '15'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Verify one-shot source, green CI and provider preflight
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.provider_preflight_run_id }}
        run: |
          import json, os
          from urllib.request import Request, urlopen
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise SystemExit('Candidate 5 reruns are forbidden')
          run_id = os.environ['PREFLIGHT_RUN_ID']
          if not run_id.isdigit():
              raise SystemExit('Invalid preflight run ID')
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def get(path):
              req = Request(base + path, headers={'Accept': 'application/vnd.github+json'})
              req.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != req.full_url:
                      raise SystemExit('GitHub evidence redirect rejected')
                  return json.load(response)
          health = get('/actions/runs/' + run_id)
          if not (health['head_sha'] == os.environ['GITHUB_SHA'] and health['name'] == 'Groq Provider Preflight' and health['conclusion'] == 'success' and health['run_attempt'] == 1):
              raise SystemExit('Passing exact-source Candidate 5 provider preflight required')
          ci = get('/actions/workflows/offline-regression.yml/runs?head_sha=' + os.environ['GITHUB_SHA'] + '&per_page=20')
          if not any(r['head_sha'] == os.environ['GITHUB_SHA'] and r['conclusion'] == 'success' for r in ci['workflow_runs']):
              raise SystemExit('Passing exact-source offline CI required')
      - name: Verify public preregistration offline
        run: python scripts/checkpoint_a_candidate5.py --verify-offline
      - name: Download source-bound Candidate 5 health receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checkpoint-a-candidate-5-provider-health-${{ inputs.provider_preflight_run_id }}
          run-id: ${{ inputs.provider_preflight_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/health
      - name: Run one fresh frozen 80-case Candidate 5 evaluation
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: >-
          python scripts/checkpoint_a_candidate5.py
          --output-dir artifacts/checkpoint-a-candidate-5
          --health-receipt artifacts/health/groq_candidate5_health_receipt.json
      - name: Preserve Candidate 5 result and all attempted-case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkpoint-a-candidate-5-results-attempt-${{ github.run_attempt }}
          path: artifacts/checkpoint-a-candidate-5/
          if-no-files-found: warn
          retention-days: 30
