name: Checkpoint A - Live Intent Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/checkpoint-a-trigger'

concurrency:
  group: checkpoint-a-live-gate
  cancel-in-progress: true

jobs:
  checkpoint-a:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      ECOCOMMIT_LLM_BASE_URL: https://api.groq.com/openai/v1
      ECOCOMMIT_LLM_MODEL: qwen/qwen3.8-27b
      ECOCOMMIT_LLM_REASONING_EFFORT: low
      ECOCOMMIT_LLM_JSON_SCHEMA: 'true'
      ECOCOMMIT_LLM_MAX_COMPLETION_TOKENS: '2048'
      ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Offline regression suite
        run: pytest
      - name: Verify live-model secret exists
        shell: bash
        run: |
          if [ -z "$ECOCOMMIT_LLM_API_KEY" ]; then
            echo 'ECOCOMMIT_GROQ_API_KEY is not configured. Checkpoint A cannot be claimed with fixtures.' >&2
            exit 3
          fi
      - name: Run live Checkpoint A evaluation
        run: python scripts/checkpoint_a_live.py --output artifacts/checkpoint_a_results.json
      - name: Print compact live diagnostics
        if: always()
        run: python scripts/checkpoint_a_diagnostics.py artifacts/checkpoint_a_results.json
      - name: Upload evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-a-results
          path: artifacts/checkpoint_a_results.json
          if-no-files-found: warn
