name: Candidate 8 - Focused Development CI

on:
  push:
    branches: [candidate8-semantic-role-redesign]
    paths:
      - 'src/ecocommit/candidate8*.py'
      - 'tests/test_candidate8_semantics.py'
      - '.github/workflows/candidate8-focused.yml'
      - 'evidence/candidate8-*.json'
      - 'scripts/candidate8_*.py'
      - 'data/candidate8-development/**'
  pull_request:
    paths:
      - 'src/ecocommit/candidate8*.py'
      - 'tests/test_candidate8_semantics.py'
      - '.github/workflows/candidate8-focused.yml'
      - 'evidence/candidate8-*.json'
      - 'scripts/candidate8_*.py'
      - 'data/candidate8-development/**'
  workflow_dispatch:

concurrency:
  group: candidate8-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run Candidate-8 focused tests
        run: python -m pytest tests/test_candidate8_semantics.py -p no:cacheprovider --basetemp .test-tmp-c8-focused
      - name: Candidate-8 static checks
        run: |
          python -m compileall -q src/ecocommit/candidate8.py src/ecocommit/candidate8_logic.py src/ecocommit/candidate8_provider.py src/ecocommit/candidate8_relation_checklist.py scripts/candidate8_develop.py tests/test_candidate8_semantics.py
          git diff --check
