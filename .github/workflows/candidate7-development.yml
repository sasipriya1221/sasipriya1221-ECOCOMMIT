name: Candidate 7 - Development Qualification

on:
  push:
    branches: [candidate7-structural-semantic-fix]
    paths:
      - evidence/candidate7-development-trigger.json

concurrency:
  group: candidate7-development-one-shot
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify trigger-only source binding
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          trigger = json.loads(Path('evidence/candidate7-development-trigger.json').read_text())
          expected = trigger['source_sha']
          parent = subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip()
          if expected != parent:
              raise SystemExit(f'trigger source_sha {expected} != parent {parent}')
          changed = subprocess.check_output(['git','diff','--name-only',parent,'HEAD'], text=True).splitlines()
          if changed != ['evidence/candidate7-development-trigger.json']:
              raise SystemExit(f'trigger commit changed unexpected files: {changed}')
          print('CANDIDATE7_SOURCE_SHA=' + expected)
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install exact project dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Deterministic pre-provider gate
        run: |
          python -m pytest -p no:cacheprovider --basetemp .test-tmp-c7-dev
          python -m compileall -q src scripts tests
          git diff --check

      - name: Run 60-case Candidate-7 development qualification
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_LLM_API_KEY }}
        run: python scripts/candidate7_qualify.py --output-dir artifacts/candidate7-development

      - name: Preserve complete development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate7-development-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/candidate7-development/
          if-no-files-found: warn
          retention-days: 30
