name: Provider Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/provider-preflight-trigger'

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_LLM_API_KEY }}
    steps:
      - name: Verify provider with one request
        shell: python
        run: |
          import json
          import os
          from urllib import request, error

          key = os.environ.get('ECOCOMMIT_LLM_API_KEY', '')
          if not key:
              raise SystemExit('secret missing')
          payload = {
              'model': 'gpt-5.6-luna',
              'messages': [{'role': 'user', 'content': 'Return JSON exactly: {"ok": true}'}],
              'response_format': {'type': 'json_object'},
              'temperature': 0,
          }
          req = request.Request(
              'https://api.openai.com/v1/chat/completions',
              data=json.dumps(payload).encode(),
              headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with request.urlopen(req, timeout=30) as r:
                  body = r.read().decode()
                  print('PREFLIGHT_OK', r.status)
                  print(body[:1000])
          except error.HTTPError as exc:
              body = exc.read().decode(errors='replace')
              print('PREFLIGHT_HTTP_ERROR', exc.code)
              print(body[:2000])
              raise SystemExit(2)
