name: Provider Preflight

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify provider with one request
        shell: python
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_LLM_API_KEY }}
        run: |
          import json
          import os
          from urllib import request, error

          key = os.environ.get('ECOCOMMIT_LLM_API_KEY', '')
          if not key:
              raise SystemExit('secret missing')
          payload = {
              'model': 'gpt-5.6-luna',
              'messages': [{'role': 'user', 'content': 'Return JSON exactly: {"ok": true}'}],
              'response_format': {'type': 'json_object'},
              'temperature': 0,
          }
          req = request.Request(
              'https://api.openai.com/v1/chat/completions',
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json'},
              method='POST',
          )
          req.add_unredirected_header('Authorization', f'Bearer {key}')
          try:
              with request.urlopen(req, timeout=30) as r:
                  if r.geturl() != req.full_url:
                      raise SystemExit('PREFLIGHT_FAILED reason=redirect_rejected')
                  body = r.read(1_048_577)
                  if len(body) > 1_048_576:
                      raise SystemExit('PREFLIGHT_FAILED reason=response_too_large')
                  decoded = json.loads(body.decode('utf-8'))
                  if not isinstance(decoded, dict) or not isinstance(decoded.get('choices'), list):
                      raise SystemExit('PREFLIGHT_FAILED reason=invalid_response')
                  print('PREFLIGHT_OK', r.status)
          except error.HTTPError as exc:
              exc.read(65_537)
              print('PREFLIGHT_HTTP_ERROR', exc.code)
              raise SystemExit(2)
