name: Checkpoint A - Development Smoke

on:
  push:
    paths:
      - '.github/checkpoint-a-smoke-trigger'
  workflow_dispatch:

concurrency:
  group: checkpoint-a-development-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ECOCOMMIT_LLM_BASE_URL: https://api.groq.com/openai/v1
      ECOCOMMIT_LLM_MODEL: openai/gpt-oss-120b
      ECOCOMMIT_LLM_REASONING_EFFORT: low
      ECOCOMMIT_LLM_JSON_SCHEMA: 'true'
      ECOCOMMIT_LLM_MAX_COMPLETION_TOKENS: '2048'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Offline regression suite
        run: pytest
      - name: Verify Groq secret exists
        shell: bash
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: |
          if [ -z "$ECOCOMMIT_LLM_API_KEY" ]; then
            echo 'ECOCOMMIT_GROQ_API_KEY is not configured.' >&2
            exit 3
          fi
      - name: Run 10 clear + 10 ambiguous live smoke cases
        env:
          ECOCOMMIT_LLM_API_KEY: ${{ secrets.ECOCOMMIT_GROQ_API_KEY }}
        run: python scripts/checkpoint_a_live.py --clear-limit 10 --ambiguous-limit 10 --workers 1 --output artifacts/checkpoint_a_smoke_results.json
      - name: Print compact smoke diagnostics
        if: always()
        run: python scripts/checkpoint_a_diagnostics.py artifacts/checkpoint_a_smoke_results.json
      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkpoint-a-smoke-results-attempt-${{ github.run_attempt }}
          path: artifacts/checkpoint_a_smoke_results.json
          if-no-files-found: warn
