name: Candidate 6 - Official A Preregistration

on:
  workflow_dispatch:

concurrency:
  group: candidate6-official-a-preregistration
  cancel-in-progress: false

jobs:
  preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          path: supervisor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: candidate6-internal-qualification
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache-dependency-path: candidate/requirements-dev.lock
      - name: Install exact candidate dependencies
        working-directory: candidate
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Refuse preregistration after any official Candidate-6 run
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os
          from urllib.request import Request, urlopen
          base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          req = Request(base + '/actions/workflows/checkpoint-a-candidate6.yml/runs?per_page=1', headers={'Accept': 'application/vnd.github+json'})
          req.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
          with urlopen(req, timeout=30) as response:
              if response.geturl() != req.full_url:
                  raise SystemExit('GitHub evidence redirect rejected')
              runs = json.load(response)
          if runs.get('total_count', 0) != 0:
              raise SystemExit('official Candidate-6 Checkpoint-A workflow already has history; preregistration refused')
      - name: Build immutable Candidate-6 official preregistration
        run: >-
          python supervisor/scripts/checkpoint_a_candidate6_prereg.py
          --candidate-root candidate
          --output /tmp/checkpoint-a-candidate6-preregistration.json
      - name: Commit preregistration before any official provider call
        id: commit_prereg
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, json, os, subprocess
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']; token = os.environ['GH_TOKEN']; base = 'https://api.github.com/repos/' + repo
          candidate_head = subprocess.check_output(['git', '-C', 'candidate', 'rev-parse', 'HEAD'], text=True).strip()
          def request_json(method, path, payload=None):
              data = None if payload is None else json.dumps(payload, separators=(',', ':')).encode()
              req = Request(base + path, data=data, headers={'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method=method)
              req.add_unredirected_header('Authorization', 'Bearer ' + token)
              with urlopen(req, timeout=30) as response:
                  if response.geturl() != req.full_url:
                      raise SystemExit('GitHub write redirect rejected')
                  return json.load(response) if response.status != 204 else {}
          branch = request_json('GET', '/branches/candidate6-internal-qualification')
          if branch['commit']['sha'] != candidate_head:
              raise SystemExit('candidate evidence branch moved during preregistration')
          try:
              request_json('GET', '/contents/evidence/checkpoint-a-candidate6-preregistration.json?ref=candidate6-internal-qualification')
          except HTTPError as exc:
              if exc.code != 404: raise
          else:
              raise SystemExit('Candidate-6 official preregistration already exists; duplicate refused')
          raw = Path('/tmp/checkpoint-a-candidate6-preregistration.json').read_bytes()
          result = request_json('PUT', '/contents/evidence/checkpoint-a-candidate6-preregistration.json', {
              'message': 'Preregister frozen Candidate 6 official Checkpoint A',
              'content': base64.b64encode(raw).decode(),
              'branch': 'candidate6-internal-qualification',
          })
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('prereg_commit_sha=' + result['commit']['sha'] + '\n')
      - name: Preserve preregistration evidence
        if: always()
        run: |
          mkdir -p artifacts/prereg
          test ! -f /tmp/checkpoint-a-candidate6-preregistration.json || cp /tmp/checkpoint-a-candidate6-preregistration.json artifacts/prereg/
          printf '%s\n' '${{ steps.commit_prereg.outputs.prereg_commit_sha }}' > artifacts/prereg/prereg-commit-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: checkpoint-a-candidate6-preregistration-${{ github.run_id }}
          path: artifacts/prereg/
          if-no-files-found: warn
          retention-days: 30
