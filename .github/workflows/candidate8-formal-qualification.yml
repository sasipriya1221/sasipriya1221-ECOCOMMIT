name: Candidate 8 - Formal Qualification
on:
  workflow_dispatch:
concurrency:
  group: candidate8-formal-qualification-850a7b5f
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {ref: "${{ github.sha }}", path: supervisor, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with: {ref: 850a7b5f1f21d7951cd4a9a840c0bebbb635d594, path: candidate, fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.11', cache: pip, cache-dependency-path: supervisor/requirements-dev.lock}
      - name: Install and validate exact frozen boundary
        run: |
          (cd supervisor && python -m pip install --require-hashes -r requirements-dev.lock)
          (cd candidate && python -m pip install --no-deps --no-build-isolation -e .)
          python -m pip check
          test "$(git -C candidate rev-parse HEAD)" = "850a7b5f1f21d7951cd4a9a840c0bebbb635d594"
          (cd candidate && PYTHONPATH="$PWD/src" python -m pytest tests/test_candidate8_semantics.py ../supervisor/tests/test_candidate8_formal_qualification.py --rootdir=. -p no:cacheprovider --basetemp ../.test-tmp-c8-formal)
          git -C candidate diff --check && git -C supervisor diff --check
      - name: Bind qualification protocol and sealed-preflight PASS
        shell: python
        run: |
          import hashlib,json,os,subprocess
          from pathlib import Path
          r=Path('supervisor'); p={'schema':'ecocommit.candidate8.formal-qualification-binding.v1','candidate':'A-CANDIDATE-8','source_sha':'850a7b5f1f21d7951cd4a9a840c0bebbb635d594','supervisor_sha':subprocess.check_output(['git','-C','supervisor','rev-parse','HEAD'],text=True).strip(),'sealed_preflight':{'run_id':'34440794156','attempt':1,'aggregate_artifact_id':'10138944664','aggregate_artifact_digest':'sha256:35677602df358909a0769349a19243e1be79423adffe54934b230d4ae1186a31','summary_sha256':'c4be609bbcfe14d829c7282519648c60829589c98d017ec89f5faed380925ea0'},'provider':'Groq','model':'qwen/qwen3.6-27b','max_completion_tokens':900,'temperature':0,'reasoning_effort':'none','pass1_prompt_sha256':'1cb84e6390e46bc3526caa6bf32376d17b115ad927d5ea1946f6459b6681b26e','pass2_prompt_sha256':'1c583d515793557d23a5c061850b641d43650fda384912d9588ce148b520dc23','evaluator_sha256':'cac4226b7a8ebb0db8adcd3d93a61dd4c3c4815aff28bb51a102fa3a9fce5316','thresholds':{'case_pass':.95,'selective_reliability':.98,'autonomous_coverage':.65,'clarification_accuracy':.90},'attempt_policy':'one formal semantic execution; bounded provider retry only','early_stop_policy':'stop when aggregate reachable becomes false','artifact_namespace':'ecocommit/candidate8/formal-qualification/v1','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'qualification_gold_inspected':False,'official_checkpoint_a_cases_used':False}
          p['binding_sha256']=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(',',':')).encode()).hexdigest(); Path('artifacts').mkdir(); Path('artifacts/binding.json').write_text(json.dumps(p,indent=2,sort_keys=True))
      - name: Generate and seal fresh untouched qualification set
        env: {PYTHONPATH: "${{ github.workspace }}/candidate/src"}
        run: python supervisor/scripts/candidate8_formal_qualification.py generate --sealed-dir artifacts/sealed
      - name: Run one formal qualification
        continue-on-error: true
        env: {ECOCOMMIT_LLM_API_KEY: "${{ secrets.ECOCOMMIT_GROQ_API_KEY }}", CANDIDATE_ROOT: "${{ github.workspace }}/candidate", PYTHONPATH: "${{ github.workspace }}/candidate/src"}
        run: python supervisor/scripts/candidate8_formal_qualification.py qualify --sealed-dir artifacts/sealed --aggregate-dir artifacts/aggregate
      - name: Generate typed PASS receipt
        if: always()
        run: python supervisor/scripts/candidate8_formal_qualification.py receipt --summary artifacts/aggregate/summary.json --binding artifacts/binding.json --output artifacts/aggregate/qualification-receipt.json
      - name: Preserve restricted qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: "candidate8-formal-qualification-restricted-${{ github.run_id }}-attempt-${{ github.run_attempt }}", path: "artifacts/sealed/", if-no-files-found: error, retention-days: 30}
      - name: Preserve authoritative aggregate and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate8-formal-qualification-aggregate-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/aggregate/
            artifacts/binding.json
          if-no-files-found: error
          retention-days: 30
