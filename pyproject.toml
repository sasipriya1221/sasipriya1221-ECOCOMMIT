[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecocommit"
version = "0.1.0"
description = "Evidence-calibrated economic commitment protocol for autonomous commerce"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.8,<3"]

[project.urls]
Repository = "https://github.com/sasipriya1221/sasipriya1221-ECOCOMMIT"
Documentation = "https://github.com/sasipriya1221/sasipriya1221-ECOCOMMIT/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
